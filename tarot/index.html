<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>塔罗占卜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#f4ecd8;
        --bg-deep:#ece0c4;
        --ink:#2d2314;
        --muted:#7d6c4c;
        --gold:#a37c2a;
        --gold-soft:#c9a44a;
        --gold-tint:rgba(163,124,42,.10);
        --accent:#7c2d3e;
        --panel:#fffaf0;
        --panel-line:#ddcda6;
        --face:#fffdf6;
        --face-ink:#33270f;
        --back-bg:#26355e;
        --back-line:#c9a44a;
        --chip-bg:#fbf4e2;
        --shadow:0 10px 30px rgba(93,70,20,.14);
        --star-op:.16;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#12101f;
          --bg-deep:#0d0b18;
          --ink:#ece4cf;
          --muted:#a79cc0;
          --gold:#d3ab55;
          --gold-soft:#e3c078;
          --gold-tint:rgba(211,171,85,.12);
          --accent:#d08a96;
          --panel:#1b1730;
          --panel-line:#3a3358;
          --face:#241d42;
          --face-ink:#f0e7cd;
          --back-bg:#1d2a52;
          --back-line:#d3ab55;
          --chip-bg:#221c3e;
          --shadow:0 12px 34px rgba(0,0,0,.45);
          --star-op:.55;
        }
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;
        background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
        color:var(--ink);
        font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        font-size:15.5px;
        line-height:1.65;
        min-height:100vh;
      }
      body::before{
        content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--star-op);
        background-image:
          radial-gradient(1.6px 1.6px at 22px 34px, var(--gold) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 130px 96px, var(--gold) 50%, transparent 51%),
          radial-gradient(1px 1px at 74px 150px, var(--gold) 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 188px 44px, var(--gold) 50%, transparent 51%);
        background-size:220px 220px;
      }
      .wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:26px 18px 60px}
      h1,h2,h3{font-family:"Noto Serif SC",serif;margin:0}
      .muted{color:var(--muted)}
      .small{font-size:12.5px}

      /* ---------- hero ---------- */
      .hero{display:flex;gap:22px;align-items:stretch;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
      .hero-t{flex:1 1 340px;display:flex;flex-direction:column;justify-content:center;padding:8px 2px}
      .hero-t h1{font-size:40px;font-weight:900;letter-spacing:.06em;line-height:1.15}
      .hero-t h1 .en{display:block;font-family:"Cinzel",serif;font-size:13px;font-weight:600;letter-spacing:.42em;color:var(--gold);margin-top:8px}
      .hero-t .sub{margin:14px 0 0;color:var(--muted);max-width:30em}
      .daily{flex:0 1 400px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:16px;align-items:center}
      .daily .d-info{flex:1;min-width:0}
      .daily .d-label{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:700}
      .daily .d-name{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700;margin:2px 0}
      .daily .d-text{font-size:13.5px;color:var(--muted);margin:0}
      .daily .d-lucky{margin-top:8px;font-size:12.5px;color:var(--ink)}
      .daily .d-lucky b{color:var(--gold);font-weight:700}
      #dailyCard{--cw:76px;flex:0 0 auto}

      /* ---------- panels ---------- */
      .panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
      .panel h2{font-size:21px;font-weight:700;margin-bottom:14px}
      .flabel{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
      .flabel:first-of-type{margin-top:0}
      textarea{
        width:100%;border:1px solid var(--panel-line);border-radius:12px;background:var(--chip-bg);
        color:var(--ink);font:inherit;font-size:15px;padding:11px 13px;resize:vertical;min-height:52px;outline:none;
      }
      textarea:focus{border-color:var(--gold)}
      .chips{display:flex;flex-wrap:wrap;gap:8px}
      .chip{
        border:1px solid var(--panel-line);background:var(--chip-bg);color:var(--ink);
        border-radius:999px;padding:6px 15px;font:inherit;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s;
      }
      .chip:hover{border-color:var(--gold)}
      .chip.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
      @media (prefers-color-scheme: dark){ .chip.on{color:#221a05} }

      .spreads{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
      .spread-opt{
        text-align:left;border:1px solid var(--panel-line);background:var(--chip-bg);border-radius:14px;
        padding:13px 14px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,background .15s;position:relative;
      }
      .spread-opt:hover{border-color:var(--gold)}
      .spread-opt.on{border-color:var(--gold);background:var(--gold-tint);box-shadow:inset 0 0 0 1px var(--gold)}
      .spread-opt .s-name{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16.5px}
      .spread-opt .s-count{position:absolute;top:11px;right:13px;font-size:11.5px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 8px;line-height:1.7}
      .spread-opt .s-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
      .spread-note{font-size:13px;color:var(--muted);margin:12px 0 0;min-height:1.4em}

      .actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
      .btn{
        border:1px solid var(--panel-line);background:var(--chip-bg);color:var(--ink);
        border-radius:12px;padding:10px 20px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
      }
      .btn:hover{border-color:var(--gold)}
      .btn:active{transform:scale(.97)}
      .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
      @media (prefers-color-scheme: dark){ .btn.primary{color:#221a05} }
      .btn.big{font-size:16.5px;padding:13px 30px;border-radius:14px}
      .btn.ghost{background:transparent}

      /* ---------- stage ---------- */
      .stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
      .stage-head h2{margin:0}
      .stage-btns{display:flex;gap:8px;flex-wrap:wrap}
      .stage-q{color:var(--muted);font-size:14px;margin:8px 0 4px}
      .stage-q b{color:var(--ink)}
      .stage-tip{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}
      #shuffleBox{padding:26px 0 8px;text-align:center}
      .dstack{position:relative;width:104px;height:166px;margin:0 auto 14px}
      .dstack .bk{position:absolute;inset:0;border-radius:9px}
      .dstack .bk:nth-child(1){transform:translate(-7px,3px) rotate(-4deg)}
      .dstack .bk:nth-child(2){transform:translate(7px,-2px) rotate(3deg)}
      .dstack .bk:nth-child(3){transform:none}
      .shuffling .bk:nth-child(1){animation:shA .22s ease-in-out infinite alternate}
      .shuffling .bk:nth-child(2){animation:shB .19s ease-in-out infinite alternate}
      .shuffling .bk:nth-child(3){animation:shC .26s ease-in-out infinite alternate}
      @keyframes shA{from{transform:translate(-16px,2px) rotate(-9deg)}to{transform:translate(2px,-3px) rotate(2deg)}}
      @keyframes shB{from{transform:translate(15px,-3px) rotate(8deg)}to{transform:translate(-2px,3px) rotate(-2deg)}}
      @keyframes shC{from{transform:translate(0,-7px) rotate(0deg)}to{transform:translate(0,5px) rotate(1deg)}}
      #shuffleBox p{color:var(--muted);font-size:14px;margin:0}

      .board{--cw:104px;display:flex;flex-wrap:wrap;gap:20px 16px;justify-content:center;padding:20px 4px 6px}
      .board.cross5{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". top ." "left center right" ". bottom .";width:100%;max-width:480px;margin:0 auto;gap:18px 14px}
      .board.celtic{display:grid;grid-template-columns:repeat(4,1fr);grid-template-areas:". five . ten" "three one six nine" ". four . eight" ". . . seven";width:100%;max-width:600px;margin:0 auto;gap:18px 12px}
      .board.cross5 .tcard,.board.celtic .tcard{width:100%}
      @media (max-width:560px){
        .board{--cw:96px}
        .board.celtic{gap:14px 8px}
      }
      .slot{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
      .slot .pos{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.14em;text-align:center}
      .slot .cname{font-size:12px;color:var(--muted);text-align:center;min-height:1.3em;line-height:1.3}
      .celtic-center{position:relative}
      .celtic-center .cross-card{position:absolute;top:46%;left:50%;width:78%;z-index:3;transform:translate(-50%,-50%) rotate(90deg)}
      .celtic-center .cross-card .tcard{width:100%}

      /* ---------- tarot card ---------- */
      .tcard{width:var(--cw,104px);aspect-ratio:5/8;perspective:1000px;background:none;border:none;padding:0;cursor:pointer;display:block;container-type:inline-size}
      .tcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.25,.7,.3,1)}
      .tcard.flipped .in{transform:rotateY(180deg)}
      .tcard.static{cursor:pointer;perspective:none}
      .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden}
      .face.front{transform:rotateY(180deg)}
      .tcard.static .face.front{transform:none;position:relative;height:100%}
      .cardback{
        background:
          radial-gradient(circle at 50% 42%, rgba(201,164,74,.28) 0 26%, transparent 27%),
          repeating-linear-gradient(45deg, rgba(201,164,74,.13) 0 2px, transparent 2px 9px),
          repeating-linear-gradient(-45deg, rgba(201,164,74,.13) 0 2px, transparent 2px 9px),
          var(--back-bg);
        border:1px solid var(--back-line);
        box-shadow:inset 0 0 0 4px var(--back-bg), inset 0 0 0 5.5px var(--back-line);
        display:flex;align-items:center;justify-content:center;color:var(--back-line);
      }
      .cardback svg{width:52%;height:auto;opacity:.95}
      .cardface{
        background:linear-gradient(165deg,var(--face) 0%,var(--face) 70%,var(--gold-tint) 130%);
        border:1px solid var(--gold);color:var(--face-ink);
        box-shadow:inset 0 0 0 3px var(--face), inset 0 0 0 4px var(--gold-soft);
        display:flex;flex-direction:column;padding:8% 7% 7%;
      }
      .revwrap{display:flex;flex-direction:column;height:100%;width:100%}
      .is-rev .revwrap{transform:rotate(180deg)}
      .cf-top{display:flex;justify-content:space-between;align-items:baseline;font-family:"Cinzel",serif;font-weight:600;font-size:12.5cqw;color:var(--gold);line-height:1}
      .cf-top .el{font-family:"Noto Sans SC",sans-serif;font-size:10cqw;letter-spacing:.1em}
      .cf-art{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gold);position:relative;min-height:0}
      .cf-art svg.art{width:58%;height:auto;max-height:92%}
      .cf-pips{position:absolute;inset:2% 4%}
      .cf-pips svg{position:absolute;width:21%;height:auto;transform:translate(-50%,-50%);color:var(--gold)}
      .cf-pips svg.big{width:44%}
      .cf-court{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:30%;color:var(--gold)}
      .cf-name{font-family:"Noto Serif SC",serif;font-weight:700;text-align:center;font-size:14.5cqw;line-height:1.25;white-space:nowrap}
      .cf-en{font-family:"Cinzel",serif;text-align:center;font-size:6.3cqw;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden}

      /* ---------- reading ---------- */
      .rrow{display:flex;gap:16px;padding:16px 0;border-top:1px dashed var(--panel-line)}
      .rrow:first-child{border-top:none;padding-top:2px}
      .rrow .mini{flex:0 0 auto;--cw:66px}
      .rrow .r-body{flex:1;min-width:0}
      .rrow .r-pos{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.16em}
      .rrow .r-title{font-family:"Noto Serif SC",serif;font-size:18.5px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
      .tag{font-family:"Noto Sans SC",sans-serif;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;line-height:1.7}
      .tag.up{background:var(--gold);color:#fff}
      @media (prefers-color-scheme: dark){ .tag.up{color:#221a05} }
      .tag.rev{background:var(--accent);color:#fff}
      .rrow .r-kw{font-size:12.5px;color:var(--muted);margin:1px 0 5px}
      .rrow p{margin:0 0 5px}
      .rrow .r-theme{font-size:13.5px;color:var(--muted)}
      .rrow .r-theme b{color:var(--gold);font-weight:700}
      .linklike{background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
      .summary{margin-top:18px;background:var(--gold-tint);border:1px solid var(--gold);border-radius:14px;padding:18px 20px}
      .summary h3{font-size:17px;margin-bottom:8px;color:var(--ink)}
      .summary ul{margin:0;padding-left:1.25em}
      .summary li{margin:4px 0}
      .summary .advice{margin-top:10px;font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700}

      /* ---------- library ---------- */
      .lib-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
      .lib-head h2{margin:0}
      .lib-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:14px 0 16px}
      .lib-tools input{
        flex:0 1 230px;border:1px solid var(--panel-line);border-radius:999px;background:var(--chip-bg);
        color:var(--ink);font:inherit;font-size:13.5px;padding:7px 15px;outline:none;
      }
      .lib-tools input:focus{border-color:var(--gold)}
      .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px}
      .lib-item{text-align:center}
      .lib-item .tcard{width:100%}
      .lib-item .li-name{font-size:12px;margin-top:5px;color:var(--muted);line-height:1.3}
      .lib-item:hover .cf-name{color:var(--gold)}

      /* ---------- history ---------- */
      .hrow{padding:12px 0;border-top:1px dashed var(--panel-line)}
      .hrow:first-child{border-top:none;padding-top:0}
      .hrow .h-meta{font-size:12px;color:var(--muted)}
      .hrow .h-q{font-weight:700}
      .hrow .h-cards{font-size:13.5px;color:var(--muted);margin-top:2px}

      footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 20px 0}

      /* ---------- modal ---------- */
      .overlay{position:fixed;inset:0;background:rgba(10,8,20,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
      @media (min-width:640px){ .overlay{align-items:center;padding:24px} }
      .sheet{background:var(--panel);color:var(--ink);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:26px;position:relative;box-shadow:var(--shadow)}
      @media (min-width:640px){ .sheet{border-radius:20px} }
      .sheet .x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-line);background:var(--chip-bg);color:var(--ink);font-size:19px;cursor:pointer;line-height:1}
      .m-in{display:flex;gap:20px}
      .m-in .m-card{flex:0 0 auto;--cw:132px}
      .m-in .m-body{flex:1;min-width:0}
      @media (max-width:560px){ .m-in{flex-direction:column;align-items:center} .m-in .m-card{--cw:118px} }
      .m-body h3{font-size:23px}
      .m-body .m-en{font-family:"Cinzel",serif;letter-spacing:.18em;font-size:12px;color:var(--gold);margin:2px 0 10px}
      .m-body h4{font-family:"Noto Serif SC",serif;font-size:15px;margin:14px 0 4px;color:var(--gold)}
      .m-body p{margin:0;font-size:14.5px}
      .kwchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
      .kwchips span{font-size:12px;border:1px solid var(--panel-line);background:var(--chip-bg);border-radius:999px;padding:1px 10px}
      .m-meta{font-size:12.5px;color:var(--muted);margin-top:12px}

      /* ---------- deep reading ---------- */
      .verdict{background:var(--gold-tint);border:1px solid var(--gold);border-radius:14px;padding:18px 20px;margin-bottom:8px}
      .verdict .v-label{font-size:12px;letter-spacing:.24em;color:var(--gold);font-weight:700}
      .verdict .v-main{font-family:"Noto Serif SC",serif;font-size:20.5px;font-weight:900;line-height:1.55;margin:7px 0 9px}
      .verdict p{margin:0;font-size:15px}
      .insights{font-size:15px;margin:14px 2px 2px}
      .insights b{color:var(--gold);font-weight:700;letter-spacing:.12em;margin-right:6px}
      .r-headline{font-family:"Noto Serif SC",serif;font-size:16.5px;font-weight:700;line-height:1.5;margin:3px 0 7px}
      .r-headline .r-sep{color:var(--gold);margin:0 2px}
      .summary .openq{margin-top:12px;font-family:"Noto Serif SC",serif;font-size:16.5px;font-weight:700}
      .summary .advice{line-height:1.6}

      [hidden]{display:none !important}
      @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
        html{scroll-behavior:auto}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <div class="hero-t">
          <h1>塔罗占卜<span class="en">TAROT READING</span></h1>
          <p class="sub">静下心，默念你想问的事。牌不会替你做决定，但会帮你把心里真正的倾向照出来。</p>
        </div>
        <div class="daily" id="dailyBox">
          <div id="dailyCard"></div>
          <div class="d-info">
            <div class="d-label">今日指引 · 每日一抽</div>
            <div class="d-name" id="dailyName">—</div>
            <p class="d-text" id="dailyText">点一下左边的牌，看看今天的指引。</p>
            <div class="d-lucky" id="dailyLucky"></div>
          </div>
        </div>
      </header>

      <section class="panel" id="askPanel">
        <h2>开始一次占卜</h2>
        <label class="flabel" for="qInput">你想问什么？</label>
        <textarea id="qInput" rows="3" placeholder="例如：这段感情会有结果吗？／最近适合换工作吗？（也可以留空，问问近期的整体运势）"></textarea>

        <span class="flabel">占卜主题</span>
        <div class="chips" id="themeChips"></div>

        <span class="flabel">选择牌阵</span>
        <div class="spreads" id="spreadGrid"></div>
        <p class="spread-note" id="spreadNote"></p>

        <div class="actions">
          <button class="btn primary big" id="btnStart" type="button">洗牌 · 开始占卜</button>
        </div>
      </section>

      <section class="panel" id="stage" hidden>
        <div class="stage-head">
          <h2 id="stageTitle">牌阵</h2>
          <div class="stage-btns">
            <button class="btn ghost" id="btnFlipAll" type="button">一键全翻</button>
            <button class="btn ghost" id="btnAgain" type="button">重新洗牌</button>
          </div>
        </div>
        <p class="stage-q" id="stageQ"></p>
        <div id="shuffleBox">
          <div class="dstack shuffling" id="dstack"></div>
          <p>正在洗牌……在心里默念你的问题</p>
        </div>
        <div id="board" class="board"></div>
        <p class="stage-tip" id="stageTip" hidden>点击牌面逐张翻开，翻完后下方会出现完整解读</p>
      </section>

      <section class="panel" id="reading" hidden>
        <h2>牌面解读</h2>
        <div id="readingList"></div>
        <div class="summary" id="summaryBox"></div>
        <div class="actions">
          <button class="btn primary" id="btnNew" type="button">再占卜一次</button>
        </div>
      </section>

      <section class="panel" id="library">
        <div class="lib-head">
          <h2>塔罗牌库</h2>
          <span class="muted small">韦特塔罗全 78 张 · 点击任意一张查看详解</span>
        </div>
        <div class="lib-tools">
          <div class="chips" id="libChips"></div>

    function cardByKey(key){

    'M0':{uh:'你骨子里藏着一股不管不顾的少年气',ud:'愚者正位说的是全新的开始，和一种不设防的信任。落到你身上，就是你对新鲜事物的好奇心总是跑在恐惧前面——别人还在算风险、列清单，你已经想亲身试试看了。这种轻盈是你的天赋，它能把你带到计划表之外的地方去。但轻盈和鲁莽只有一线之隔：跳之前先瞄一眼落点，别让一时的兴起，替你还长期的账。',rh:'你不是不敢开始，是怕开始错了',rd:'愚者逆位常在两种状态里摇摆：要么想太多迟迟不动，要么一冲动就踩空。看这张牌出现的位置，你多半是前者——心里其实早就想动了，却总拿「还没准备好」当挡箭牌，一天拖过一天。准备这件事永远不会百分之百齐全，你缺的不是条件，是允许自己先迈出一小步。先动一格，世界自然会给你反馈。',ut:'轻装上路',rt:'先迈一小步',g:'敢于重新开始的勇气',l:'跳之前先看清落点，别拿冲动当勇气'},
    'M1':{uh:'你手里其实什么都有，就差动手',ud:'魔术师正位说的是资源齐备、只待行动：想法、技能、人脉、时机，你一样都不缺。落到你身上，这张牌在提醒你，你卡住从来不是因为「没条件」，而是注意力太散，什么都想抓，结果哪件都没真正开始。把劲儿收到一件事上，它就会成形。你的本事是实打实的，现在缺的，只是一个不再观望的决定。',rh:'你的本事不差，差的是落地',rd:'魔术师逆位说的是空有想法、落不了地，或者本事还没练稳就急着表现。你不是没能力，而是容易在「想通了」的那一刻就以为事情已经做完了，真正动手时又嫌麻烦、怕露怯。还有一种可能：最近有人在用漂亮话带你的节奏。把承诺收一收，先拿出一件做完的成品，比说十句都在理管用。',ut:'聚焦动手',rt:'少说多做',g:'把想法变成现实的执行力',l:'别用「想通了」代替「做完了」'},
    'M2':{uh:'你心里其实早有答案，只是不肯承认',ud:'女祭司正位说的是直觉与静待：答案不在热闹的讨论里，在你安静下来时冒出的第一个念头里。你这个人感知力很强，往往第一眼就看穿了事情的走向，只是理性和旁人的声音太吵，把那个声音盖住了。这段时间先别急着表态和行动，观察、倾听、等水落石出。有些信息正在幕后成形，耐心的人，会先看到全貌。',rh:'你一直在忽略自己心里的声音',rd:'女祭司逆位说的是直觉被屏蔽：你明明感觉哪里不对，却用「想多了吧」把自己说服过去；或者有些话一直压着没说，压成了心里的结。你不是没有判断力，是太怕判断错了之后要承担后果，于是宁可装不知道。但身体比嘴诚实——失眠、烦躁、坐立不安，都是它在替你说话。找个安静的时刻，把真正想说的话先写下来。',ut:'听从直觉',rt:'别再装不知道',g:'敏锐得近乎预知的直觉',l:'信任自己的第一感觉，并为它负责'},
    'M3':{uh:'你是个能把日子过丰盛的人',ud:'皇后正位说的是丰盛、滋养与创造力。你身上有一种让人安心的气场：会照顾人，也会把普通的日子过出滋味，身边人很容易在你这里获得能量。这段时间你的创造力和吸引力都在生长，手头的事适合像照顾花园一样经营——浇水、等待、不催促，它会以超出预期的方式回馈你。唯一要留心的，是别把耐心耗在只索取不回馈的人身上。',rh:'你把所有人都照顾好了，唯独漏了自己',rd:'皇后逆位说的是付出失衡：你习惯性地把别人的需求排在自己前面，忙到最后，自己的电量先见了底。还有一种情况是创造力卡住了——明明想做点什么，却提不起劲，于是更自责。这张牌在提醒你：杯子空了是倒不出水的。先把自己喂饱、睡好、哄开心，你的能量回来之后，很多事会自己顺起来。',ut:'丰盛滋养',rt:'先滋养自己',g:'把日子和身边人都照顾好的能力',l:'把自己的需求也排进日程表'},
    'M4':{uh:'你骨子里是个要把局面稳住的人',ud:'皇帝正位说的是秩序、责任与掌控。你做事有框架、讲规矩，答应下来的事基本不会掉链子，身边人遇到拿不准的事，第一反应就是来问你。这段时间正是立规矩、搭结构的时候，长远的安全感来自计划和纪律，而不是运气。只是要记得：稳不等于硬。你定的规则是用来保护事情的，不是用来把人推远的，留一点弹性，威信反而更稳。',rh:'你攥得太紧了，反而什么都攥不住',rd:'皇帝逆位说的是掌控欲过头，或者规则僵化到了反噬的程度。你最近可能有点「必须按我的来」的劲儿，越想把一切攥在手里，局面越容易从指缝里漏出去；也可能你正在面对一个比你更强势的人，被压得喘不过气。先分清哪些是真正不能让的底线，哪些只是习惯性的不放心。松开次要的，才能守住主要的。',ut:'立规矩稳局面',rt:'松开次要的',g:'扛事和定盘的担当',l:'分清底线与执念，控制欲要让位于信任'},
    'M5':{uh:'你比想象中更需要一条被验证过的路',ud:'教皇正位说的是传统、传承与指引。这段时间，「按规矩来」对你比标新立异更有效：成熟的经验、靠谱的前辈、现成的体系，都是现成的梯子，别因为想证明自己就非要另辟蹊径。你也到了一个适合向人请教的阶段——那个你觉得有点「老派」的人，手里可能正握着你最需要的那把钥匙。放下身段去问，不丢人，走弯路才丢人。',rh:'老办法开始失灵了，你心里清楚',rd:'教皇逆位说的是权威失效、规矩失灵。你可能正卡在一个尴尬里：明明照着一直以来的做法在走，结果却越来越不对；或者某位你曾经很信服的人，这次给的建议让你心里直打鼓。这张牌不是让你叛逆，而是提醒你形成自己的判断——规矩是用来参考的，不是用来跪的。经验要听，但最后拍板的人，必须是你自己。',ut:'借力前人经验',rt:'形成自己的判断',g:'站在巨人肩膀上的学习力',l:'别把别人的经验当成自己的答案'},
    'M6':{uh:'你正在面对一道考验真心的选择题',ud:'恋人正位说的核心其实不是爱情，而是选择：当两个选项摆在面前，它考验的不是利弊计算，而是你真正珍视什么。你最近的纠结，本质上是价值观在打架——一个选项更安全，一个选项更像你自己。这张牌的建议很直白：选那个和内心一致的，哪怕它短期不划算。选错了可以改，选了一个不像自己的，你会在之后的每一天里慢慢还账。',rh:'你不是没得选，是不敢选',rd:'恋人逆位说的是失衡与拖延：关系里有一方在将就，或者选择拖得太久，久到不选本身变成了一种消耗。你心里其实倾向很明显了，只是不愿意承担选了之后要面对的那些麻烦——怕冲突、怕让谁失望、怕后悔。但你要知道，勉强维持的平衡比打破它更累。先把自己的真实想法说出口，哪怕声音有点抖。',ut:'忠于内心去选',rt:'别再勉强合拍',g:'在大事上忠于自己内心的勇气',l:'停止用拖延逃避选择，怕后悔也要选'},
    'M7':{uh:'你一旦认准方向，爆发力惊人',ud:'战车正位说的是意志与进取：目标明确，缰绳在自己手里。你这个人最大的特点是「动起来之后停不下来」——内心那些互相拉扯的念头，一旦被一个清晰的目标拧成一股绳，你的推进速度会让身边人吃惊。这阵子正适合攻城拔寨，把最重要的那件事往前猛推一段。唯一要防的是：速度太快时容易忽略同行者的感受，赢了目标，冷了人心，就不划算了。',rh:'你不是没劲儿，是方向太多在内耗',rd:'战车逆位说的是方向混乱、用力过猛。你最近可能同时在追好几件事，每件都使了劲，每件都没跑远，累得不行还怪自己不够努力。其实问题不在马力，在方向盘：几个目标互相打架，油门踩得越狠，内耗越大。先停下来，只留一个这一阶段真正要去的地方。还有，和人较劲赢了的那种「胜利」，多半是偏离了自己的路，别捡。',ut:'全速前进',rt:'先定方向再踩油门',g:'认准目标后的推进力',l:'把内耗的几个方向收成一个'},
    'M8':{uh:'你的力量不在嗓门，在耐心',ud:'力量正位说的是以柔克刚：真正的强，不是压住别人，而是稳住自己。你处理棘手事情的方式一直是这样——不吵不闹，慢慢磨，用稳定的情绪和持续的在场，把最难缠的问题一点点磨软。这段时间继续用这个打法：对方越急，你越稳。但也要诚实地说，这份耐心是有成本的，你不是不累，只是习惯了不说。累的时候，允许自己先停一停。',rh:'你的耐心快被耗光了，而你还在硬撑',rd:'力量逆位说的是自我怀疑和情绪临界。你最近可能反复在心里问自己「我到底行不行」，或者某件小事突然就让你破防——那不是小事的问题，是你已经撑太久了。硬撑不是力量，情绪上头时做的决定多半要返工。这张牌建议你先处理状态，再处理事情：睡一觉、吃顿好的、找人说说。把自己的电充回来，狮子自然就好驯了。',ut:'以柔克刚',rt:'先照顾好状态',g:'温柔而坚定的耐力',l:'别把硬撑当坚强，累了就先停下来'},
    'M9':{uh:'你需要一个人待一会儿，谁都别劝',ud:'隐士正位说的是内省与独处。你不是不合群，是有些答案只能在安静里找——热闹能给你信息，但给不了你方向。这段时间适合暂时退开人群，复盘、研究、蓄力，把过去一阵的得失在心里过一遍。你的灯照亮的范围不大，但足够看清脚下的路。等你想明白了再出来，别人会发现你整个人都不一样了。别怕这段「消失」，它不是掉队，是换挡。',rh:'你躲得太久了，独处变成了逃避',rd:'隐士逆位说的是孤僻与逃避：一个人待着本来是充电，但如果待到连消息都不想回、邀约全推掉，那就不是休息，是在躲某个你不想面对的问题。也可能你正在错误的岔路上越走越远，却因为没人提醒而浑然不觉。这张牌提醒你：灯也可以照向别人——找个信得过的人聊聊，或者干脆把求助说出口。请教不丢人，闷头走错才可惜。',ut:'独处蓄力',rt:'别把逃避当清净',g:'在独处中想清大事的定力',l:'该求助时开口，别一个人走错路'},
    'M10':{uh:'你的运气正在换挡，转机比你以为的近',ud:'命运之轮正位说的是周期转动、顺势而为。卡了很久的局面，最近有松动的迹象——可能是一个消息、一次偶遇、一个你没太当回事的机会。这张牌对你的要求是保持机动：计划别钉得太死，手里留一个备选，轮子转到你面前时能立刻跳上去。好运很少敲锣打鼓地来，它多半伪装成一件小事。眼下你唯一要做的，是别在转机出现时正好在走神。',rh:'你正处在这一轮的低处，但轮子还在转',rd:'命运之轮逆位说的是时运不济、原地打转。你最近可能有种使不上劲的感觉：同样的努力，放在顺风时早有回报了，现在却像打在棉花上。这不是你的问题，是周期走到了低处。这段时间最忌讳的是赌气式加码和频繁换方向——先稳住基本盘，守住现金流和身体，等这一轮转过去。记住，没有人永远在谷底，就像没有人永远在顶端。',ut:'顺势而上',rt:'稳住基本盘',g:'在变化中抓住时机的嗅觉',l:'低谷期不赌气、不折腾、守住基本盘'},
    'M11':{uh:'你心里有杆秤，骗不了自己',ud:'正义正位说的是公平、真相与因果。你这个人对「该不该」特别敏感，自己吃点亏可以忍，但见不得事情不讲道理。这段时间，事情会按它应得的样子结算：付出会得到回报，藏着的问题会被摆上台面。对你的建议只有一句——用事实和规则说话，别掺情绪，别讲人情。这一局里，诚实是最稳的策略，你过去攒下的靠谱，正在变成你的信用额度。',rh:'有笔账，你一直没跟自己算清楚',rd:'正义逆位说的是不公与逃避：可能你在某件事上受了委屈却没处说，也可能——扪心自问——有一份本该你负的责任，你一直在绕着走。这张牌不站队，它只提醒顺序：先把自己的账算清楚，再去评判别人的账。如果你确实是被亏待的一方，就把证据和边界摆出来，理性地争取，比默默生闷气有用得多。',ut:'凭事实说话',rt:'先算清自己的账',g:'讲原则、明事理的公道心',l:'该争取时别忍气吞声，该认账时别躲'},
    'M12':{uh:'你现在最好的行动，是先停下来',ud:'倒吊人正位说的是暂停与换角度。你眼下有件事卡住了，越使劲越卡——这正是这张牌出现的原因：有些答案，正着看看不见，倒过来看才明白。这段时间不妨主动按下暂停键，暂时放下「必须马上解决」的执念，去睡个觉、换个环境、听听局外人的看法。你的停顿不是躺平，是在等视角翻转的那一刻。等想通了再动，你会发现之前纠结的根本不是问题本身。',rh:'你为一件事牺牲太多，久到忘了为什么',rd:'倒吊人逆位说的是无谓牺牲与拖延过头。你在某段关系或某件事上忍了很久，久到「忍」本身变成了习惯，你甚至说不清自己在等什么。这张牌说得直白：不等了、不忍了、不耗了。牺牲要换得来意义才叫牺牲，换不来的，那叫消耗。从倒吊上下来，脚踏实地的第一感觉可能有点晕，但那是自由的晕。',ut:'换个角度看',rt:'停止无谓牺牲',g:'能暂停、能换位思考的智慧',l:'分清值得的坚持和无谓的牺牲'},
    'M13':{uh:'有个阶段该翻篇了，你知道是哪一个',ud:'死神正位说的是结束与新生——不是吓人的那张牌，是腾位置的那张牌。你心里清楚，有件事、某种状态或者一段关系，已经走到了它的尽头，拖着只是让告别变得更难看。体面地翻篇，旧的清干净了，新的才有地方进来。你不用急着知道下一页是什么，死神牌的承诺从来都是：门后面有光。回头看看你的人生，每一次大的变好，前面都站着一个你当时很怕的结束。',rh:'你什么都明白，就是舍不得放手',rd:'死神逆位说的是抗拒结束。你不是看不清这件事已经结束了，你是不甘心——不甘心投入的那些时间、感情和钱，就这么算了。可是拖着并不会让沉没成本回来，只会让它继续涨利息。该翻篇的迟早要翻，主动翻，你是作者；被动翻，你是观众。这次，做一次作者。先从最小的那件开始了断，你会发现没有想象中疼。',ut:'体面告别',rt:'主动翻篇',g:'敢于结束、重新来过的魄力',l:'别让沉没成本绑架你的未来'},
    'M14':{uh:'你的节奏感，比大多数人好',ud:'节制正位说的是平衡、调和与耐心。你处理事情有一种难得的分寸感：知道什么时候该推一把、什么时候该等一等，能把不同的意见、资源和节奏调到一起。这段时间继续用这份功夫——手头的事急不得，但也不需要急，按现在的配比慢慢推进就好。唯一提醒你：调和别人的人最容易累，记得也在自己的杯子里留一口水，别全倒给了别人。',rh:'你的生活有一块明显过头了',rd:'节制逆位说的是失衡与过度：最近你的天平歪得很明显，可能是熬夜、可能是情绪性消费、可能是把某一件事想得太多、做得太满。失衡最麻烦的地方在于，它会伪装成「我最近状态不好」这种大而化之的感觉，让你找不到源头。这张牌的解法很具体：找出最过头的那一项，先砍掉一半。身体和日程表，都会立刻感谢你。',ut:'恰到好处',rt:'砍掉最过头的一项',g:'拿捏分寸的调和能力',l:'盯住最失衡的那一项，先砍一半'},
    'M15':{uh:'有样东西正绑着你，你心里有数',ud:'恶魔正位说的是欲望与束缚：一段上瘾的关系、一个戒不掉的习惯，或者对钱、对认可、对某个人放不下的执念。这张牌不评判你，它只请你诚实一分钟：那个你「想停又停不下来」的东西，到底是什么？你会发现，那条锁链其实比想象中松得多——多数束缚，是我们默许它存在的。承认它，是松绑的第一步；装看不见，它只会越绑越紧。',rh:'你正在挣脱，而且已经松动了',rd:'恶魔逆位说的是觉醒与戒断：你已经看清了绑住自己的东西是什么，并且开始往外走——戒掉的习惯、拉开的距离、拒绝的诱惑，都是证据。这段时间是整个过程里最难熬的几天，旧习惯会变着法子喊你回去。别回头，也别因为偶尔反复就全盘否定自己。这张牌站在你这边：能看清锁链的人，已经走了一半的自由。',ut:'诚实面对欲望',rt:'别回头',g:'直面阴影的诚实',l:'在戒断最难熬的几天守住不回头'},
    'M16':{uh:'有座塔要倒，倒下来是好事',ud:'高塔正位说的是突变与打破重建：某个你以为很稳固的东西——计划、关系、认知——可能正在或即将剧烈摇晃。先别急着扶墙。这张塔之所以立得住，是因为地基里掺了假：一个没说破的谎、一个拖着没处理的问题、一份高估了的安全感。闪电劈下来的那一刻最狼狈，但地基清干净了，你才能盖真的。护住自己和最要紧的东西，其余的，让它倒。',rh:'你已经预感到了，却还在假装没事',rd:'高塔逆位说的是拖延崩塌：你心里其实早就察觉某件事不对劲了——数据、感觉、旁人的提醒都在报警，你却选择性失明，想着「再撑撑，说不定就过去了」。这张牌的语气很直接：拖延只会让变动来得更猛。主动小修，好过被动大塌。今天就去处理那个你一直在绕开的隐患，哪怕只是打一通电话、做一次摊牌。',ut:'推倒重建',rt:'主动处理隐患',g:'在变局中护住核心的果断',l:'别假装没看见正在报警的问题'},
    'M17':{uh:'你许的那个愿，值得继续相信',ud:'星星正位说的是希望、疗愈与灵感。折腾你的那阵风暴，正在过去——你可能还没完全感觉到，但身体先知道：最近是不是有某个瞬间，你突然觉得「好像也没那么糟」。这张牌出现的意义，就是请你郑重地保留那个愿望，别用「现实点吧」把它掐灭。这段时间适合慢慢疗愈、做点创造性的事、把想了很久的计划写下来。星星不刺眼，但一直在，你抬头的时候它都在。',rh:'你最近有点不敢抱希望了',rd:'星星逆位说的是信心低迷：努力了一阵没看到回报，你开始怀疑「是不是我不配」「是不是根本没用」。这种失望最耗人，它会让你连小机会都懒得伸手。这张牌的解法不宏大：先做几件小而确定的事——整理一个抽屉、兑现一个小承诺、完成一件拖了很久的小事——把「我可以」的感觉一点点找回来。光不是一下亮起来的，是一颗一颗星先亮起来的。',ut:'保留愿望',rt:'先做小而确定的事',g:'低谷里依然相信的韧性',l:'别拿一时的没回报否定整个愿望'},
    'M18':{uh:'你最近的不安，一半是直觉，一半是想象',ud:'月亮正位说的是潜意识与迷雾：事情还没浮出水面，你的焦虑和直觉正在打架——理智说没事，心里却总有个角落不踏实。这张牌建议你先别急着下判断，尤其别在深夜做决定。留意这几天的梦和一闪而过的念头，它们比白天的分析更接近真相。还有些话，别人只说了一半，剩下一半别靠猜，去问。雾里走路，慢就是快。',rh:'困住你的那团雾，正在散开',rd:'月亮逆位说的是迷雾散去、真相浮现：困扰你许久的那件「看不清」的事，最近正在一点点明朗——一个被证实的消息、一次把话说开的机会、或者你自己突然想通了。情绪也随之趋稳，半夜惊醒的次数在变少。再等一等，答案就要自己浮上来了。这段时间适合把悬而未决的事收尾，但不适合立刻开启新的大局，等视线完全清楚再说。',ut:'让子弹飞一会儿',rt:'雾散时收尾',g:'敏锐的潜意识感知力',l:'别在深夜和情绪里做重大决定'},
    'M19':{uh:'好消息在路上，你可以大方地期待',ud:'太阳正位是整副牌里最明亮的一张：喜悦、成功、坦诚。它说的事情很简单——你担心阴霾的那件事，正朝着明朗的方向走；你的表现会被看见，你的坦诚会被回应。这段时间别缩着，大方地站到阳光下：想表白的、想展示的、想争取的，都值得一试。你身上有一种感染力最近特别强，和你在一起的人都能沾到光。快乐有时候不需要理由，允许自己单纯地高兴几天。',rh:'你的开心被乌云暂时挡了一下',rd:'太阳逆位说的是暂时阴霾，或乐观过了头。一方面，事情的底子并没有变坏，只是光被挡了一阵，你容易把「暂时」误读成「一直」。另一方面，也检查一下自己是不是把预期定得太满、话说得太早——把尺寸调到合脚，好事走起来才稳当。乌云会散的，这段时间先照顾好能量：多晒太阳、多见让你笑的人，状态先行，运气随后。',ut:'大方站到阳光下',rt:'把预期调到合脚',g:'自带感染力的乐观',l:'分清暂时阴霾和真正变坏'},
    'M20':{uh:'有个声音在喊你，你已经听见很久了',ud:'审判正位说的是觉醒与召唤：过去所有的经历，好像都在把你推向一个决定——一个你其实早就知道答案、却一直用「再等等」拖着的决定。这段时间适合诚实地复盘：哪些是真正想要的，哪些只是习惯和别人的期待。分清之后，响应那个声音。真正的重生不是换一种活法，是终于肯按自己的活法活。别小看这次的信号，它很少敲第二次门。',rh:'你对自己，判得太重了',rd:'审判逆位说的是逃避复盘与自我苛责：你要么一直在躲一次必要的总结，要么就是把过去的错翻来覆去地审判自己，判得比谁都重。这两种其实是同一件事——没和过去和解，所以没法轻装上路。这张牌提醒你一个顺序：先原谅过去的那个自己，再谈下一步。他当时用的是当时的认知，已经尽力了。账算到这里，翻篇。',ut:'响应内心的召唤',rt:'先原谅过去的自己',g:'直面过去的勇气',l:'停止反复审判过去的自己'},
    'M21':{uh:'你要走完一整圈了，这事值得庆祝',ud:'世界正位说的是圆满与完成：一个周期正在收官，目标达成，各部分归位。你这段时间会体验到一种难得的「整」——事情、人、自己的状态，恰好拼成了一幅完整的图。这份完整感值得好好庆祝，别急着扑向下一个目标，先认真享受一下「我做到了」的感觉。世界牌的另一层意思是：走完这一圈的你，已经有资格开启更大的一圈了。地图在变大，你也是。',rh:'就差最后一步，你却有点想停下来',rd:'世界逆位说的是差临门一脚：事情的大头都完成了，就剩收尾的那一小截，你却莫名地拖着——怕交出去被评价，怕结束之后要面对新的开始，或者只是单纯累了。先定位：到底哪个环节没有闭环？是手续、是沟通，还是心里那道坎？把它补上，这件事才算真正属于你。拖着不收尾的圆满，会慢慢发酵成遗憾。',ut:'圆满收官',rt:'补上最后的闭环',g:'把事情真正做完的完整感',l:'别在临门一脚时拖延收尾'},
    'wands1':{uh:'你心里那团火，已经压不住了',ud:'权杖王牌正位说的是灵感与机会被点燃：一个新的念头、一次邀请、一个让你眼睛发亮的方向，正在敲门。你这个状态最好的地方是热血还在——很多人到了一定阶段就只剩权衡了，你还能为一件事兴奋。这张牌建议你果断开始，先干起来再说。但也提醒一句：火点起来容易，续上难。开始之前就想好第二步、第三步，别让三分钟热度替你收尾。',rh:'你的火不是没点着，是柴还没备齐',rd:'权杖王牌逆位说的是动力不足或计划延迟：你心里明明有个想做的事，却总觉得「时机不对」「状态不好」，迟迟点不着火；或者火点着了又很快熄掉，反复几次之后，你开始怀疑是不是自己的问题。多半不是——是你在点火之前没备柴：目标太大、步骤太空。这次把第一步砍到小得不好意思拒绝的程度，先烧起来再说。',ut:'趁热开始',rt:'把第一步砍小',g:'为一件事热血上头的劲儿',l:'给热情配上一份能续航的计划'},
    'wands2':{uh:'你站在岔路口，心其实已经偏了一边',ud:'权杖二正位说的是站在高处规划未来：手里的已经不错了，但你望着更远的地方，心里痒。你这个纠结很真实——留下，是安稳；走出去，是可能性。这张牌不催你选，它提醒你先看清自己怕的到底是什么：怕失败，还是怕离开舒适区之后没人兜底？想清楚这一层，选择自己会浮出来。另外，别人的意见这阶段听听就好，路是你自己走的。',rh:'你犹豫得太久，机会在替你做决定',rd:'权杖二逆位说的是犹豫不决、计划搁浅：两个方向各想了一半，哪个都没往前推，时间却在一天天走。你怕选错——但说句实话，拖着不选，本身就是最差的那个选项，它同时消耗着两个方向。这张牌建议你给自己设一个死线，到点必须选一个先走。走错可以修正，站着不动，连修正的机会都没有。',ut:'先看清怕什么',rt:'给犹豫设死线',g:'望向远方的眼界',l:'停止用纠结代替选择'},
    'wands3':{uh:'你等的那条船，正在靠岸',ud:'权杖三正位说的是前期投入开始见效：你之前埋头做的那些事——投出去的简历、谈了一半的合作、坚持了很久的习惯——正在陆续有回音。这张牌的姿势是站在岸边远眺：不催、不慌，但眼睛一直看着海面。你现在要做的是接应，而不是怀疑。唯一要提醒的是，眼光可以再放远一点，眼前这点收获只是开始，别急着把刚冒头的成果全部收割。',rh:'船晚点了，先别急着换码头',rd:'权杖三逆位说的是扩张受阻或眼光偏差：期待的回音迟迟不来，你开始怀疑当初的方向是不是错了。先别全盘推翻——延迟和失败是两回事。这张牌建议你检查的是航向而不是船：是不是目标定偏了、对象选错了、时机算早了一步？小幅调舵可以，弃船最亏。你付出的那些，一样都没白费，它们只是需要换一个靠岸的方式。',ut:'远眺接应',rt:'调舵不弃船',g:'为长远布局的耐心',l:'分清延迟和失败，别急着推倒重来'},
    'wands4':{uh:'你打下的这块地基，比你以为的稳',ud:'权杖四正位说的是阶段性成果与安稳：折腾了这么久，你终于有一块可以喘口气的地方——一个落定的结果、一群处得来的人、一种「暂时不用打仗了」的踏实。这张牌请你认真庆祝一下，哪怕只是吃顿好的。你这个人容易达成一个目标就立刻看向下一个，难得停下来确认自己已经走了多远。根基稳了，才好盖更高的楼；人心安了，才走得了更远的路。',rh:'热闹是别人的，你心里还没安顿好',rd:'权杖四逆位说的是根基未稳或内部不和：表面上事情好像落定了，你心里却总有一块不踏实；或者团队、家庭里有个小别扭一直没说开，逢年过节、聚在一起时格外明显。这张牌建议你先安内：那个小疙瘩趁还小的时候解开，拖成大结就难了。安顿感不是等来的，是把该说的话说了、该修的地方修了之后，自己长出来的。',ut:'踏实庆祝',rt:'先安内再攘外',g:'营造安稳感的本事',l:'小疙瘩趁早解开，别攒成大结'},
    'wands5':{uh:'最近的摩擦多，但不是冲你来的',ud:'权杖五正位说的是竞争与摩擦：几个人、几种意见搅在一起，谁也不服谁。你最近可能觉得处处有人跟你别着劲，心里憋火。这张牌要你看清一件事：这种乱，多半是局势本身在磨合，不是谁针对你。把它当成练兵而不是战争——在较量里把你的本事磨利，把不合适的合作筛掉。但底线要守住：可以争，别结仇；局面天天变，今天的对手可能是明天的队友。',rh:'你一直在躲的那场冲突，躲不掉了',rd:'权杖五逆位有两副面孔：一是冲突正在缓和，紧绷的气氛开始松动；二是你在回避真正的问题，表面和平、底下较劲。如果你最近总觉得哪里不对却又说不上来，多半是后者——有些话你咽下去太多次了。这张牌建议你选个合适的场合，把核心问题摆一次桌面。真正的和气，是吵完之后还能一起吃饭的那种，不是把话都憋死的那种。',ut:'把摩擦当练兵',rt:'别再回避问题',g:'在竞争里保持分寸',l:'把咽下去的话找机会说出来'},
    'wands6':{uh:'这一局，你值得被看见',ud:'权杖六正位说的是胜利与认可：你做的事正在被看见，成绩会被摆到台面上，夸奖和机会都会向你聚过来。这张牌请你做一件对你来说不太容易的事——大方地接受。别习惯性地说「没有没有，运气好」，那是对自己付出的不尊重。当然，站在高处时也记得扶一把身边的人：愿意为别人鼓掌的胜者，路才走得远。收官收得漂亮，下一局的入场券就已经在手里了。',rh:'期待的掌声没响，别急着否定自己',rd:'权杖六逆位说的是认可落空：你觉得自己明明做得不错，该来的肯定、名次或回应却迟迟没到，甚至落到了不如你的人头上，心里堵得慌。先分清两件事：是你的成果真的不够，还是只是舞台和时机不对？前者就回去补本事，后者就换个会被看见的地方。这段时间尤其忌讳为了争一口气而高调行事——低调收尾、暗自蓄力，等下一次，你连解释都省了。',ut:'大方接受认可',rt:'低调蓄力',g:'赢得起的实力',l:'别为争一口气打乱自己的节奏'},
    'wands7':{uh:'你在守一个值得守的位置',ud:'权杖七正位说的是坚守立场、以一当多：你现在处在一个「高处不胜寒」的位置——有点成绩，就有人质疑、挑战、等着看你出错。这张牌的态度很硬气：站住，别退。你手里的东西是你一步步挣来的，不需要向每一个质疑者自证。但守也要讲方法：分清哪些挑战值得回应，哪些只是噪音。把力气留给前者，你的阵地自然固若金汤。',rh:'你守得太累了，先看看还值不值得',rd:'权杖七逆位说的是守到力竭、开始动摇：你为一件事、一个立场、一段关系硬扛了太久，最近某个瞬间突然想「算了，放弃吧」。先别在最累的时候做决定。问自己两个问题：这件事本身还值得吗？还是只是我不甘心沉没成本？值得，就换种守法——求援、收缩、轮换，别一个人扛全部；不值得，体面撤退不是输，是把兵力留给更重要的战场。',ut:'站住别退',rt:'先确认值不值得守',g:'顶住压力的骨气',l:'别让不甘心冒充值得'},
    'wands8':{uh:'事情要加速了，你坐稳扶好',ud:'权杖八正位说的是快速进展：拖了很久的事会突然动起来，消息一个接一个，节奏快得让人有点兴奋也有点慌。你最近的关键词是「顺」——顺风的时候别犹豫，该回复的立刻回，该签的尽快签，窗口开着的时间不会太长。这张牌也提醒你：速度上来之后，细节最容易出错。越是顺，越要在关键节点上留个确认的动作，快和稳可以兼得。',rh:'消息满天飞，但没有一条是准信儿',rd:'权杖八逆位说的是延误与信息混乱：等的那件事又推迟了，或者几方传来的说法对不上，你被夹在中间干着急。先别跟着乱——这张牌建议你先做一件事：把沟通对齐。找到信息源头，确认唯一版本，再往下推进。延误本身不可怕，可怕的是在混乱里仓促行动。这几天适合慢半拍：别人催你的时候，你把「确认好了再动」说出口，不丢人。',ut:'顺风快行',rt:'先对齐信息',g:'顺势加速的果断',l:'越乱越要确认，别在混乱里仓促行动'},
    'wands9':{uh:'就差最后一公里，你已经看见终点了',ud:'权杖九正位说的是带伤坚持：你累，是真的累——这一路走过来，质疑、反复、体力透支，你都尝过了。但你回头看看，你站的位置离终点比离起点近得多。这张牌对你的态度是敬意加提醒：敬意是给你的韧性的，提醒是——最后这段路最容易因为松懈而翻车。把防备心留一点给细节，把力气匀着用。你不需要再证明什么，你只需要走完。',rh:'你防备得太用力，连帮忙的人都挡在外面',rd:'权杖九逆位说的是防备过度和精疲力竭：你最近对谁都留着三分戒心，拒绝了所有靠近，连真心想帮你的人也被挡在门外——不是你不懂好意，是你实在没有力气再赌一次了。这张牌想跟你说：学会求援不是认输。把最重的那件担子分出去一点，不会让你的坚持贬值。一个人走完全程很酷，但有人扶一把的那段路，也不丢人。',ut:'走完最后一公里',rt:'学会开口求援',g:'带伤也要走完的韧性',l:'把戒心分一点给信任，求援不是认输'},
    'wands10':{uh:'你背的东西太多了，多到不正常',ud:'权杖十正位说的是重担压身：责任一件叠一件，你像棵移动的圣诞树，谁路过都往你身上挂一件。你能扛，是真的；但「能扛」正在变成所有人继续加码的理由。这张牌很严肃地提醒你：你现在的状态不可持续。挑出背上最不该由你背的那两件，今天就还回去或者分出去。会哭的孩子有奶吃，会扛的人只会被加担——你的边界，必须由你自己先画出来。',rh:'是时候把担子放下一部分了',rd:'权杖十逆位说的是卸担的开始：你已经在学着放下了——推掉了一些不属于你的事，或者某件压了很久的事终于交割完毕，肩膀有种久违的轻。这张牌鼓励你继续，并提醒一个细节：放下的时候别带着愧疚。那些担子很多本来就不该是你的，你背了这么久，已经仁至义尽。轻装之后腾出来的力气，留给真正重要的事，别手一空就又去揽新的。',ut:'分担而非硬扛',rt:'放下别带愧疚',g:'扛得起事的担当',l:'先画边界，再谈担当'},
    'wands11':{uh:'有个新机会，带着好奇心去看看不会错',ud:'权杖侍者正位说的是热情的消息与探索的起点：一个让你心动的方向、一条刚听到的消息、一门刚想学的本事——火苗还小，但方向感很好。你这个阶段最大的资本就是新鲜劲儿，别用成年人的功利心太早去审判它：先玩起来、先学起来、先认识那几个人。探索期的任务不是变现，是确认「我是不是真的喜欢」。答案是肯定的话，后面的路自己会展开。',rh:'你的三分钟热度，又开始计时了',rd:'权杖侍者逆位说的是热度消退或消息不实：一样东西你兴冲冲地开始，没几天就凉了；或者一个听起来很好的消息，核实下来并不靠谱。这张牌不是嘲笑你的热情，是提醒你给热情装一个「核实」的步骤：动手之前先查证，花时间之前先小规模试一周。你的火不缺，缺的是护火的罩子。把开始的门槛降到「先试七天」，很多事就有下文了。',ut:'好奇心先行',rt:'先核实再兴奋',g:'对新事物的热情',l:'给热情装上核实的步骤，先试七天'},
    'wands12':{uh:'你天生有种说走就走的魅力',ud:'权杖骑士正位说的是冲锋与冒险：你身上有一股「先动起来再说」的劲儿，目标感强、行动力爆棚，身边人很容易被你的状态点燃。这段时间适合主动出击——想去的地方、想争取的机会、想认识的人，别等信号，先迈步。你的魅力在行动里，不在观望里。但骑士的短板你也要认：容易虎头蛇尾。出发前先把终点定下来，冲得再猛，也别丢了要去的地方。',rh:'你冲得太猛了，刹车都冒烟了',rd:'权杖骑士逆位说的是鲁莽急躁、虎头蛇尾：你最近可能刚因为冲动吃过一个小亏——话说太快、决定下太急、或者一件事开了头就没影了。这张牌不是让你从此畏手畏脚，是请你给油门配个刹车：重要的事，强制自己多想三步；脱口而出的话，先过一遍「说了会怎样」。你的行动力是天赋，别让它被「不靠谱」的评价埋没了，稳住，你能走得更远。',ut:'主动出击',rt:'多想三步再冲',g:'说走就走的行动力',l:'给行动力配上刹车和终点'},
    'wands13':{uh:'你往那一站，气场就是答案',ud:'权杖王后正位说的是自信、温暖与号召力：你身上有一种不需要解释的感染力——热情是真的，待人是热的，做起事来又有一股不服输的劲儿。这段时间你的状态很适合站到台前：带头做件事、组织一群人、或者单纯地把自信穿在身上。别再低估自己的吸引力了，你随口的一句鼓励，可能就是别人记很久的话。把光放出来，它照亮别人的同时，也会照亮你的路。',rh:'你的光最近有点晃，先稳住自己的火',rd:'权杖王后逆位说的是情绪化或自信动摇：你最近可能因为一件小事突然就不自信了，或者情绪起伏明显，被比较心、嫉妒心偷袭过。这不代表你的光灭了，只是火苗被风吹晃了。这张牌建议你回到自己的节奏里：少看让你焦虑的比较，多做能给你确认感的事。你的魅力从来建立在「我是我」上，不建立在赢过谁上。稳住自己的火，比什么都重要。',ut:'把光放出来',rt:'少比较多确认',g:'自带感染力的自信',l:'别让比较心偷走自己的节奏'},
    'wands14':{uh:'你是个能带人打硬仗的人',ud:'权杖国王正位说的是远见与领导力：你看事情比大多数人远一步，也敢在关键时刻拍板。你不是靠嗓门带人的那种，你是靠「跟他干有奔头」这种信服感。这段时间有件大事在等你定方向，别躲，你的判断就是团队的定心丸。但国王的功课也要提前说：权力感最容易腐蚀判断，越是所有人都听你的，越要留一只耳朵给反对意见。服人靠理不靠压，你一直都懂。',rh:'你最近有点太想说了算了',rd:'权杖国王逆位说的是专断与冲动：最近你可能在某个决定上太独断，听不进不同意见，甚至有点「我的地盘我做主」的上头；或者你正被这样一个人压着，有气没处出。这张牌的提醒对两种情况都成立：权威这东西，用一次少一次，真正的分量来自判断的准确率。把拍板的速度放慢一拍，多问一句「还有别的可能吗」，你的段位反而会更高。',ut:'拍板定方向',rt:'多听一句反对意见',g:'带人打硬仗的领导力',l:'让权威来自准确率，而不是嗓门'},
    'cups1':{uh:'你的心，最近被打开了',ud:'圣杯王牌正位说的是情感的源头活水：一段新的心动、一份久违的感动，或者单纯是你对生活重新有了感觉。你可能自己都没意识到，最近你笑的次数变多了，看什么都顺眼了一点。这张牌请你珍惜这个状态，不要急着用理性去分析它、定义它。心打开的时候，灵感和好运是跟着一起进来的。对那个让你有感觉的人或事，勇敢一点，先往前走一步看看。',rh:'你的心门关着，钥匙在你自己手里',rd:'圣杯王牌逆位说的是情感堵塞：你最近有点「什么都提不起劲、什么都感动不了」的麻木感，对人对事都隔着一层。这不是你冷漠，是你的心在自我保护——之前投入过、失望过，所以先把阀门拧小了。这张牌的顺序很重要：先学会对自己好，把觉睡足、把饭吃好、把自己哄回来，心里的水才能重新流动起来。别急着爱别人，先跟自己和解。',ut:'先打开心门',rt:'先爱自己',g:'感受幸福的能力',l:'别用麻木保护自己，先把阀门打开一点'},
    'cups2':{uh:'有一段关系，正在和你双向奔赴',ud:'圣杯二正位说的是平等的连接与互相流动：你和某个人之间，正在建立一种舒服的默契——付出有回应，话能说到一块儿，在对方面前不需要端着。这张牌出现在感情里是心照不宣的靠近，出现在合作里是棋逢对手的合拍。你要做的很简单：继续真诚，继续回应。好的关系不需要经营得多用力，它需要的是两个人都不把手收回去。你先伸着，对方也在伸着。',rh:'你在关系里，付出和收到的不对等',rd:'圣杯二逆位说的是连接出了问题：一段关系里，付出和回应明显失衡了——可能是你给得多、收得少，也可能是对方热、你冷。这张牌落到你身上很具体：你在感情或深度友情里偏保守，不太轻易把真实感受摊开给别人看。别人进一步，你才进一步；对方稍微退一点，你就先缩回去。你不是不在乎，而是太怕热脸贴冷屁股，所以宁愿表现得淡一点。可关系的账不是这么算的：你收着，对方也会收着。这一课，是先伸一次手。',ut:'双向奔赴',rt:'先伸一次手',g:'与人建立真连接的能力',l:'在关系里别太收着，先回应再观望'},
    'cups3':{uh:'你的快乐，有人陪你一起放大',ud:'圣杯三正位说的是欢聚与友谊：这段时间你身边的「人气」很旺——朋友的陪伴、团队的氛围、一场说走就走的聚会，都会给你的状态充电。你这个人平时有点习惯自己消化情绪，但这张牌提醒你：快乐和人分享是会翻倍的，难处说出来是会减半的。别总当那个默默退场的人，主动组个局、赴个约，你会发现自己比想象中更被需要，也更被喜欢。',rh:'热闹散场之后，你要小心点消耗',rd:'圣杯三逆位说的是小圈子的是非或聚散的消耗：最近可能有些场合让你心累——表面热闹，底下比较、试探、传话，或者一段友情走到了散场的路口。这张牌建议你做一次筛选：哪些关系是给你充能的，哪些是耗你的电的，慢慢把时间配比调过来。另外，别人的八卦少掺和，站在漩涡边上的人，最后多半也会湿鞋。热闹会散，能留下的关系才是真的。',ut:'和朋友分享快乐',rt:'筛选耗电的关系',g:'被朋友环绕的人缘',l:'远离是非圈，把时间留给充能的人'},
    'cups4':{uh:'机会就摆在眼前，你却哪个都不想要',ud:'圣杯四正位说的是倦怠：手边明明有几个现成的选项——一份工作、一个人、一个邀请——你却哪个都提不起兴趣，只想原地待着。这不是你眼光高，是你累了，或者上一件事的失望还没消化完，所以对新东西本能地防备。这张牌不催你选，它建议你先承认倦怠：给自己放个真正的假，什么都不想。但别待太久，递到面前的那杯水，放凉了就不好喝了。',rh:'你正在重新对生活有胃口了',rd:'圣杯四逆位说的是从倦怠里苏醒：你之前那种「什么都无所谓」的状态，正在慢慢退潮——开始愿意赴约了，开始对某个新机会多看一眼了，心里那点好奇心又冒头了。这张牌肯定你这个转弯，并提醒你乘势而上：把那个让你多看了一眼的机会，认真接住看看。人的状态就是这样回来的，不是一下子热血沸腾，是先愿意伸手接一杯水。保持这个势头，别又缩回去。',ut:'先承认倦怠',rt:'接住新邀约',g:'不将就的品味',l:'倦怠可以休息，但别把机会晾凉了'},
    'cups5':{uh:'你盯着打翻的那几杯，忘了身后还有满的',ud:'圣杯五正位说的是失落与遗憾：有一件事没成、一个人走了、一个期待落空了，你心里那道坎还没过去，时不时就要回头看一眼。这份难过是真实的，不用急着「想开点」。但这张牌画得很清楚：你面前打翻了三杯，身后还立着两杯满的，桥也在那里。你失去的是真的，你还拥有的也是真的。等悲伤的劲儿过去一点，转过身——生活的那部分，还在等你。',rh:'你已经在从低谷里往外走了',rd:'圣杯五逆位说的是走出低谷、学会释怀：最难的那阵子，你已经熬过去了——虽然偶尔还会想起，但在心里激起的浪没有以前大了。你正在明白一件事：有些失去不是惩罚，是腾地方。这张牌鼓励你把转身的动作做完：该告别的正式告别一次，该联系的人主动联系一次。雨过天会晴不是安慰话，是你已经站在晴天的边上了，再走两步就到。',ut:'身后还有满的',rt:'把转身做完',g:'难过但不沉溺的自愈力',l:'哀悼要有期限，别让遗憾无限续费'},
    'cups6':{uh:'一个老地方、一个老朋友，要回来了',ud:'圣杯六正位说的是怀旧与重逢：旧人、旧事、旧地方，最近会以某种方式回到你的生活里——可能是一次联系、一场聚会、一趟故地重游，也可能只是一首老歌把你带回去。这张牌的温度是暖的：它提醒你，你来时的路也值得珍惜，那些陪你走过一段的人，不会因为走散了就变得不重要。但怀旧归怀旧，脚步要向前：回忆是用来取暖的，不是用来定居的。',rh:'你被过去绊住了，有点走不出来',rd:'圣杯六逆位说的是困守过去：你最近总忍不住把现在和「以前」比——以前的人、以前的状态、以前的简单，越比越觉得现在没意思。说句你可能不爱听的：你怀念的那个版本，也被你的记忆美化过了。这张牌不是让你忘恩负义，是请你把目光的比例调一调：七分看前方，三分念旧。人不能靠回忆当饭吃，你最好的那几年，还没来呢。',ut:'温暖地怀旧',rt:'目光向前调',g:'念旧而重情的心',l:'回忆用来取暖，别用来定居'},
    'cups7':{uh:'选项太多了，先分清哪些是幻觉',ud:'圣杯七正位说的是选择太多、幻想太多：你面前摆着一排杯子，每只里面都装着一个诱人的版本——不同的工作、不同的人、不同的活法——你看花了眼，迟迟下不了手。这张牌点得很透：这些选项里，有一半是被你的想象镀了金的，真实的成色没那么好。解法是把每个选项落到最具体的层面去问：钱怎么算、日子怎么过、代价谁付。落不了地的，划掉。剩下的，才值得你纠结。',rh:'你已经看清了，可以动手选了',rd:'圣杯七逆位说的是看清真相、做出取舍：蒙在眼睛上的那层雾散了——某个选项的真面目、某个人的真实分量、某件事的可行性，你心里已经有数了。看清之后就别再装糊涂：该放弃的放弃，该锁定的锁定。这张牌很少夸人，但它对你的状态是认可的：世界清净下来之后，人的力气才使得对地方。把选好的那个，当成唯一选项去推进。',ut:'划掉落不了地的',rt:'锁定之后别回头',g:'在幻象里保持清醒',l:'想清楚就执行，别再反复横跳'},
    'cups8':{uh:'你心里清楚，有些东西该放下往前走了',ud:'圣杯八正位说的是离开与追寻：眼前的这一摊，不算差——杯子摆得整整齐齐，日子也过得去——但你心里知道，它不是你要的那个。月亮已经升起来了，这张牌支持你走：去找那个「更重要的东西」。离开需要勇气，尤其当留下也说得过去的时候。但你要相信这种直觉：让你在深夜里睡不着的那个念头，不会骗你。走的时候体面一点，别摔门，身后留个好名声。',rh:'你想走又舍不得，留又不甘心',rd:'圣杯八逆位说的是徘徊：去和留之间，你来回摇摆了好一阵——走吧，不甘心之前的投入；留吧，心里那股不满足又压不下去。这种两头堵的状态最耗人，耗的还都是你的好时光。这张牌建议你换个问题问自己：不是「走不走」，而是「再给它多久」——设一个明确的期限和观察指标，到点按结果决定。用规则结束摇摆，比用情绪结束摇摆，靠谱得多。',ut:'体面地往前走',rt:'给摇摆设期限',g:'不满于将就的追求',l:'用规则结束摇摆，别耗在两头堵里'},
    'cups9':{uh:'你许的那个愿，要成真了',ud:'圣杯九正位被叫作「愿望牌」：心想事成的满足感，正在向你靠近。你之前默默许下、甚至不太敢说出口的那个愿望，最近有落地的迹象。这张牌也肯定你的状态：你最近整个人是舒展的、知足中带着期待，这种气场本身就会吸引好事。当然，它也轻轻提醒一句：愿望达成时别忘了当初为什么想要它，享受成果，但别让满足感变成新的焦虑——比如立刻去想下一个更大的。你值得单纯地高兴一阵。',rh:'你得到的不少了，但总觉得还差一点',rd:'圣杯九逆位说的是满足感的短缺：客观上你拥有的并不少，可你心里那个「还差一点」的声音一直都在——差一点被认可、差一点到那个数、差一点像别人那样。这种不满足推着你走，也偷着你的快乐。这张牌想让你算一笔账：如果把「已经拥有的」列一张清单，它比你想象的长。贪心不是原罪，但让贪心坐在驾驶座上，你永远到不了「够了」的那一站。',ut:'享受愿望成真',rt:'列一张已拥有清单',g:'吸引好事的舒展状态',l:'别让「还差一点」偷走已经到手的快乐'},
    'cups10':{uh:'你想要的那种安稳，正在成形',ud:'圣杯十正位说的是情感的圆满与归宿：像家人一样的和乐——不一定是字面意义的家庭，是那种「这些人、这个地方、这种日子，就是我想要的」的心安。你这段时间在关系里的运气很好，适合把重要的关系再往前推一步：确认下来、住到一起、或者把一直想说的话说了。这张牌也提醒你，圆满不是终点站，是需要偶尔维护的日常：再稳的关系，也要记得说谢谢。',rh:'表面和气，但有句话一直没说',rd:'圣杯十逆位说的是表面和睦、内里有缺口：一段关系或者家庭氛围，看上去没什么问题，但你心里知道有块地方是空的——一句话没说、一个结没解、一种失望没被承认。和气维持得越久，缺口越难开口补。这张牌建议你找一个平和的时机，把那句话用不伤人的方式说出来。真正的圆满不是没有裂缝，是裂缝被认真修补过。别怕开口，你想要的那种好，一直都在裂缝后面等着。',ut:'心安即是归宿',rt:'把没说的话说出来',g:'经营长久关系的耐心',l:'别用和气掩盖缺口，裂缝要趁早补'},
    'cups11':{uh:'会有一句温柔的话，递到你面前',ud:'圣杯侍者正位说的是温柔的消息与情感的萌芽：最近可能有一句让你心里一动的话——一句表白、一份邀约、一声迟到的道歉，或者只是某个人不经意间流露的在意。你的直觉这段时间也格外敏锐，谁对你真心、谁在客套，你一耳朵就能听出来。这张牌建议你柔软一点：别用玩笑和岔开话题把真心挡回去。认真回应一份真心，是成年人最稀缺的体面。',rh:'有些话听着甜，你先别急着当真',rd:'圣杯侍者逆位说的是消息暧昧、情绪多愁：最近可能有一句模棱两可的话让你反复琢磨，或者你自己的情绪像水位一样涨落不定，一点小事就能想很多。这张牌提醒你两件事：一，别急着对号入座，暧昧的话在被证实之前只是话；二，情绪多的时候少做决定，等水位退下去再看，很多当时觉得天大的事，都会回到它本来的尺寸。你感性是天赋，别让它变成内耗。',ut:'认真回应真心',rt:'暧昧的话先别当真',g:'敏锐而柔软的感受力',l:'情绪涨潮时不做决定，等水位退下去'},
    'cups12':{uh:'有人正带着心意，向你走来',ud:'圣杯骑士正位说的是浪漫的提议与随心而至的邀约：最近很可能有一个人，带着明确的善意向你靠近——不一定是爱情，也可能是一个合作、一份机会，都是「跟着感觉走一次」的类型。你平时偏理性，这张牌难得地站感性这边：有些事，算得太清就没意思了。当然，跟感觉走不等于闭着眼走：心可以热，底线要清。去赴那个约吧，故事都是从答应一次邀约开始的。',rh:'甜言蜜语要打个折听',rd:'圣杯骑士逆位说的是情绪多变、承诺难兑现：最近可能有人对你许了很好听的诺，或者你自己的心意也在反复——今天想这样，明天想那样。这张牌的提醒很实在：话说出口的时候是真的，不代表兑现的时候也是真的。看一个人，别看他说什么，看他上次说的做到了没有。对你自己的提醒也在里面：别在情绪上头时许诺，那种诺，十个有九个要还利息。',ut:'赴一次心动的约',rt:'看行动不看许诺',g:'感知浪漫的雷达',l:'别在情绪上头时许诺，也别轻信许诺'},
    'cups13':{uh:'你懂人心的本事，是天生的',ud:'圣杯王后正位说的是共情与体贴：你有一种本事——不用别人多说，就能感觉到对方情绪的变化，并且知道该递水还是该闭嘴。身边人愿意跟你掏心窝子，不是没有原因的。这段时间你的直觉尤其准，重要的事可以多听听心里那个声音。但这张牌也心疼你一句：你接住了太多别人的情绪，自己的却总排在最后。倾听者也需要被倾听，找个你信得过的人，也让他听听你的。',rh:'你把别人的情绪都接住了，自己的满出来了',rd:'圣杯王后逆位说的是过度敏感与内耗：你最近的情绪像没关紧的水龙头——别人的一个眼神、一句无心的话，都能在你心里滴答半天。你不是脆弱，是感受力的阈值太低了，身心都在喊累。这张牌建议你做一次「情绪断舍离」：分清哪些情绪是你的、哪些是别人的，别人的还给别人。再给自己留一段谁都不回消息的时间，把杯子倒空，你才不会溢出来。',ut:'倾听者也要被听',rt:'分清谁的情绪',g:'天生的共情力',l:'别替全世界消化情绪，先管好自己的水位'},
    'cups14':{uh:'你的情绪稳得住，是身边人的福气',ud:'圣杯国王正位说的是情绪的成熟与包容：你已经过了情绪一来就掀桌子的阶段，现在的你，能在心里翻江倒海的时候，表面依然把事情稳稳处理好。这种定力不是装的，是修养出来的。身边人把你当依靠，是因为你接得住事、也接得住人。这张牌也肯定你近期的一个决定方向：用温和的方式处理，它就是对的。唯一提醒：稳重的人最容易被默认为「不需要关心」，你也要记得给自己留一个可以不稳重的角落。',rh:'你把情绪压得太好了，好到有点疏离',rd:'圣杯国王逆位说的是压抑与疏离：你最近把情绪管理得滴水不漏——该笑的场合都笑了，该办的事都办了——但亲近的人能感觉到，你离他们远了一点。有些话你觉得「说了也没用」「别给人添麻烦」，就一直咽着。这张牌说：成熟不是没有情绪，是能把情绪好好地说出来。找一个信得过的人，把压着的那件事说一次。你会发现，说出来，天不会塌，关系反而更近了。',ut:'稳得住也接得住',rt:'把压着的话说一次',g:'成熟稳定的情绪定力',l:'别把「不添麻烦」当成疏远亲近人的理由'},
    'swords1':{uh:'你脑子里那把剑，已经磨好了',ud:'宝剑王牌正位说的是真相与突破：你的思路从未像现在这样清晰——一件纠缠很久的事，你突然就想明白了关键在哪，像一剑劈开团团乱麻。这张牌支持你把结论说出来、执行下去：谈判、摊牌、签字、做决定，现在都是好时机。但宝剑是双刃的：话要利，落点要准，别伤到无辜的人。你最近的判断力值得信任，唯一的前提是——确保你掌握的是事实，而不是情绪。',rh:'你现在下的结论，多半要推翻',rd:'宝剑王牌逆位说的是混乱与误判：信息不全、情绪上头、或者有人在故意搅浑水——这三样无论占了哪样，现在都不是下结论的时候。你可能很想立刻表态、立刻站队、立刻把话说死，先忍住。这张牌建议你把「我以为」和「我确认过」分开写下来，没确认过的部分，一个字都别拿去当论据。等雾散了再挥剑，宝剑这东西，挥错一次，伤的是自己人。',ut:'一剑斩开迷雾',rt:'先分清事实与情绪',g:'看清真相的洞察力',l:'没核实之前，不下结论、不站队'},
    'swords2':{uh:'你蒙着眼睛，不是在等，是在躲',ud:'宝剑二正位说的是僵局与回避：两个选项在你心里势均力敌，你用「再想想」把决定一天天往后推，表面上是谨慎，其实心里清楚——你是怕选任何一个都要付出代价，所以宁可维持这种难受的平衡。这张牌不催你，但它指出一个事实：蒙眼的姿势保持久了，手臂是会酸的，而且局面不会自己变好。摘下布条的第一步，是承认自己到底在怕什么。',rh:'信息太多反而更乱，你必须做取舍了',rd:'宝剑二逆位说的是信息过载与被迫取舍：各方说法塞满了你的脑子，每多听一个意见，你就多摇摆一次。这张牌说得很明白：你缺的不是信息，是标准。先定一条你最在乎的原则——钱、时间、感受、长远，选一个当尺子，其他的自动降权。拖延本身也是一种选择，而且通常是最贵的那个。这周之内，给自己一个了断，哪怕选完还要调整。',ut:'先看清在怕什么',rt:'定一条取舍标准',g:'在压力下保持平衡的定力',l:'别用拖延当答案，它是最贵的选择'},
    'swords3':{uh:'有个真相会让你疼一下，但疼得值',ud:'宝剑三正位说的是心痛的真相：一句实话、一个发现、一次把话说穿的对话——它会让你难受一阵，这是躲不掉的。但这张牌出现，往往意味着这颗雷早晚要爆，现在爆，比你一直隐隐猜着、夜里翻来覆去地想，要仁慈得多。疼是真的，解脱也是真的。不要在这个时候逼自己坚强，该难过就难过，情绪流干净了，心里那块地方才能长出新的东西。这一课很贵，别浪费它。',rh:'你的伤口正在结痂，别再去揭它',rd:'宝剑三逆位说的是疗愈进行中：那件让你心痛的事，正在慢慢翻篇——你可能发现自己已经能平静地提起它了，或者提起的次数明显变少了。这张牌一方面肯定你的恢复，一方面提醒你别犯两个错：一是没事就去翻旧账、试探伤口还疼不疼；二是好了伤疤忘了疼，同样的坑再跳一次。痂结好之前，让它安静长着。你值得往前走了。',ut:'疼完就解脱',rt:'别再去揭伤口',g:'直面真相的承受力',l:'伤好了就往前走，别反复试探它疼不疼'},
    'swords4':{uh:'你现在最该做的事，是什么都不做',ud:'宝剑四正位说的是休息与恢复：你的身心已经亮了黄灯——那种累不是睡一觉就好的累，是连着紧绷太久之后的整体透支。这张牌的指令非常明确：停下来，躺平，充电，在这件事上偷懒不叫偷懒，叫战略修整。你那些「休息时也不安」的念头，先放一放：你不是机器，就算机器也要停机保养。等电充满了，那些你焦虑的事，一件都跑不了，而且你处理它们的速度会快一倍。',rh:'你歇够了，再躺下去就该锈了',rd:'宝剑四逆位说的是静极思动：这段时间的休息、停滞、观望，已经完成了它的使命——你的电充得差不多了，最近是不是开始有点「躺不住了」，想动一动、想做点什么？那就是信号。这张牌鼓励你重新出发，但讲究一个梯度：先恢复日常节奏，再接小事，最后才碰大目标。别一上来就满负荷——刚复出的身体和状态，经不起你这么使。慢慢加码，你会回到正轨的。',ut:'安心休整',rt:'慢慢恢复节奏',g:'懂得停下来的自律',l:'休息有期限，别把修整过成荒废'},
    'swords5':{uh:'这一架你能赢，但先算算值不值',ud:'宝剑五正位说的是赢了局面输了人心：眼下这场较量，你不是没有胜算，手段、道理、气势你都有。问题只在于代价——争到底，你可能赢了这件事，却把关系、口碑或者自己的心情赔进去。这张牌不是劝你认怂，是请你先标价：这件事的输赢，到底值多少钱、值多少关系？值得，就果断打，别拖泥带水；不值得，体面退场，把力气留给更重要的仗。真正的强者，挑战场。',rh:'这场僵局，正在等你先把姿态放软',rd:'宝剑五逆位说的是冲突的化解与收尾：一场别扭了很久的较劲，正在出现转机——可能是对方先释放了信号，也可能是你自己想通了「没必要」。这张牌建议你顺势接住：把姿态放软一点，给台阶，也下台阶。但和解不等于没原则：把事情说开的同时，把各自的边界讲清楚，免得同样的摩擦再来一遍。能把残局收漂亮的人，比能打赢的人段位更高。',ut:'先标价再开战',rt:'顺势把残局收漂亮',g:'该出手时不手软的锋芒',l:'赢之前先算代价，别赢了事输了人'},
    'swords6':{uh:'你正在离开一片风浪，方向是对的',ud:'宝剑六正位说的是过渡与远行：你下定决心离开一个让你消耗的环境、关系或者状态，正在驶向更平静的水面。这个过程不热闹，甚至有点沉默——你不想解释太多，只想安安静静地把自己运过去。这张牌肯定这个决定：有些离开不需要告别仪式，想通了就是仪式。提醒一句：行李里别装太多旧情绪，船会重。带上经验，把怨气留在岸上，前面水域的平静，是你应得的。',rh:'有件旧事没了结，你的船还系在岸上',rd:'宝剑六逆位说的是难以抽身：你想走，却总被什么绊住——一句没说完的告别、一笔没算清的账，或者一种「就这么走了不甘心」的心结。这张牌指出，绊住你的往往不是现实的绳索，而是心里那道没过的坎。抽身之前，先把那个小结解开：该谈的一次谈清，该还的还清，该说的对不起或谢谢，别省。结解开了，船自然就动了，别硬扯，扯断的绳子会抽到自己。',ut:'安静地过渡',rt:'先解开那个结',g:'离开消耗源的决断',l:'告别要做完，别带着旧情绪上船'},
    'swords7':{uh:'这一局，靠脑子比靠力气管用',ud:'宝剑七正位说的是策略与机变：眼下这个局面，硬碰硬不是最优解——你需要一点迂回、一点信息差、一点「不按常理出牌」。这张牌肯定你的小聪明用对地方时的杀伤力，但也划了一条线：策略和算计之间隔着一层纸，别为了赢一局，把自己的信誉搭进去。另外，留心暗处：你动的脑筋，别人也在动，重要信息别轻易全盘托出。这局拼的是谁的地图更清楚，你先把地形摸透再动手。',rh:'有些事，要败露了，坦荡才是上策',rd:'宝剑七逆位说的是谎言被揭穿或回归坦荡：可能是一件你藏着的事浮出了水面，也可能是你发现别人在局里动了手脚。无论是哪种，这张牌的建议都指向同一个方向——摊开。藏着的雷，越晚爆越贵；你若是被蒙的一方，现在发现就是最好的发现。把事情放回桌面上用规则解决，短期可能难看，长期最划算。坦荡不是天真，是算清了总账的聪明。',ut:'用策略不用蛮力',rt:'把事情摊回桌面',g:'随机应变的机敏',l:'小聪明别越线，信誉比赢一局贵'},
    'swords8':{uh:'困住你的那堵墙，多半是自己想出来的',ud:'宝剑八正位说的是束缚与困局：你觉得四面都是墙——没钱、没时间、没人支持、没有退路——每一条听起来都很成立。但这张牌画得很清楚：绑着你的绳子是松的，蒙眼的布是你自己的，你脚下的路一直都在。你缺的不是条件，是「我可以不一样」的那个念头。这段时间适合做一个最小的反抗动作：拒绝一件不想做的事、挪出一小时给自己。墙是从一个缺口开始塌的。',rh:'你正在自己走出那个困局',rd:'宝剑八逆位说的是打破枷锁、重获自由：你最近做了一个关键的转变——想通了某件困住你很久的事，不再等别人来放你出去了。可能是一个决定、一次拒绝、一句终于说出口的「不」。这张牌明确肯定你：自由这东西，从来不是被赐予的，是自己走出去的。刚走出来的时候步子会虚，正常。别回头看那堆绳子，你以后的日子，不在那里。',ut:'墙上有缺口',rt:'把自由走完',g:'绝境里找出口的韧性',l:'别等别人放你出去，绳子本来就是松的'},
    'swords9':{uh:'你半夜担心的那些事，天亮多半没那么糟',ud:'宝剑九正位说的是焦虑与失眠：你最近的夜晚不太好过——躺下之后脑子开始加班，把白天没处理完的事、最坏的可能性、别人的一句话，翻来覆去地想。这种焦虑有一半是真的操心，另一半是疲惫在放大音量。这张牌不跟你讲大道理，只给你一个顺序：先把觉睡好，再处理问题。实在睡不着，就把担心的事写下来，写在纸上的焦虑，比在脑子里盘旋的好对付得多。',rh:'最难熬的那个阶段，要过去了',rd:'宝剑九逆位说的是压力释放：把你压得喘不过气的那件事，正在松动——可能是结果落了地（哪怕不是最好的结果，落地本身就是解脱），可能是你终于找人说出来了。这张牌告诉你：你扛过来的，值得自己认可。接下来的任务是善后：把作息调回来，把透支的身体补回来，别刚出ICU就去跑马拉松。阴影散的时候不用追，站着晒晒太阳就好。',ut:'先把觉睡好',rt:'给身体善后',g:'在焦虑里扛住的耐力',l:'把担心写下来，别任它在深夜放大'},
    'swords10':{uh:'最坏的已经发生了，接下来只有向上',ud:'宝剑十正位说的是谷底与终结：有一件事以最难看的方式收了尾——计划泡汤、关系断裂、期待落空，而且是那种「一点回旋余地都没有」的落地。疼是真疼。但宝剑十的图景里，天边是亮着的：十把剑已经全部落下，不会再多了。这张牌想让你接受一个事实：剧情到这里就是底了，底的好处是，接下来每一步都是往上走的。先别急着重建，让自己疼几天、丧几天，这是程序的一部分。',rh:'你已经触底了，反弹只是时间问题',rd:'宝剑十逆位说的是触底反弹、慢慢复原：最黑暗的那个阶段已经过去，你正在一点点把自己拼回来——开始睡得着了，开始对一些事有反应了，开始能笑出来了。恢复的速度可能让你不耐烦，觉得「怎么还没好」。这张牌请你对自己公平一点：你受的那一下不轻，复原本来就是按月算的，不是按天算的。每天好一点点，就是很好的进度。别跟没受伤的人比速度，你比的是昨天的自己。',ut:'底下面没有底了',rt:'每天好一点点',g:'触底后不躺平的命硬',l:'复原按月算，别跟没受伤的人比速度'},
    'swords11':{uh:'你最近的好奇心，是笔财富',ud:'宝剑侍者正位说的是敏锐与求知：你的脑子最近转得很快，新消息、新知识、新八卦——你的雷达全开着，学什么都上手快。这段时间特别适合学新技能、打听行业消息、把一直想搞懂的东西搞懂。但这张牌也提醒你：消息灵通的人，最容易踩的坑是嘴比脑子快。听到的事先核实再转述，看到的料先存疑再兴奋。你的敏锐用在学习上是天赋，用在传话上就是风险，界限你自己划。',rh:'最近的是非有点多，你离远一点',rd:'宝剑侍者逆位说的是流言与是非：你周围可能正有一小团浑水——传话的、带节奏的、话里藏话的，一不留神你就会被卷进去当枪使。这张牌建议你把好奇心收一收：不打听、不转述、不站队，尤其别在情绪最热闹的时候发表意见。还有，如果最近有人说话明显在钓你，记住：你给的每个反应，都会成为下一轮话术的素材。冷处理，是你这阶段最聪明的回应。',ut:'把敏锐用在学习上',rt:'不打听不站队',g:'过耳不忘的学习力',l:'管住好奇心，别被流言当枪使'},
    'swords12':{uh:'你的快，是武器，但要瞄准了用',ud:'宝剑骑士正位说的是行动迅猛、直言快语：你一旦认定目标，出手速度是碾压级的——别人还在开会讨论，你已经到终点了。这种风格在需要攻坚的时候极其珍贵，最近正好有这样的场合，适合你打头阵。但这张牌必须把后半句说完：你的嘴比你的剑还快，脱口而出的话伤过人，你自己多半也有数。重要场合之前，把要说的话在心里过一遍筛子。快不是问题，快而准，才是你真正的段位。',rh:'你最近有点横冲直撞，言语已经伤到人了',rd:'宝剑骑士逆位说的是冲撞与口舌之伤：最近可能刚发生过一次不愉快——一句话说重了、一个决定下猛了，场面有点收不回来。这张牌不是让你从此谨小慎微，而是请你给速度装一个瞄准器：出口之前，先想一秒「这话的目的到底是什么」。如果只是为了赢一口气，那就咽回去；如果是为了解决事，换个说法，效果一样，代价小得多。道歉如果欠着，趁热说了，凉了就更难开口。',ut:'快而准',rt:'出口前先想一秒',g:'攻坚时的爆发速度',l:'给嘴装个筛子，欠的道歉趁热说'},
    'swords13':{uh:'你的清醒，是吃过亏才换来的',ud:'宝剑王后正位说的是理性与独立：你是一个看透了也不轻易说透的人——人情冷暖、规则潜台词，你心里都有一本账。这份清醒不是天生的，是被事情磨出来的，所以格外值钱。这段时间你适合做决策者、把关人：别人拿不准的事，你的判断可以信。但这张牌也轻声提醒你：理性是铠甲，穿久了会忘了里面还有个柔软的人。偶尔卸下来一次，在信得过的人面前，不必什么都自己扛。',rh:'你用理性包着情绪，包得自己都有点冷',rd:'宝剑王后逆位说的是尖刻或旧伤未愈：你最近的言辞可能有点带刺——不是对人有恶意，是心里有一块旧伤还没好，碰一下就本能地竖起剑来。或者，你正用一种过分冷静的姿态处理一件其实很伤你的事，冷静到身边人都不敢靠近。这张牌想说：旧伤不处理，会替你做很多决定。找个出口把它说出来，或者写下来。再硬的剑，也需要一个鞘——那个鞘，就是能让你卸下防备的人和地方。',ut:'看透不说透',rt:'给旧伤一个出口',g:'千帆过尽的清醒',l:'别用带刺保护旧伤，该处理就处理'},
    'swords14':{uh:'你是个能让人服气的人，靠的是道理',ud:'宝剑国王正位说的是理智的权威：你做判断时有一种让人安心的稳定——就事论事、不带情绪、标准清晰，所以别人愿意把重要的事托付给你拍板。这段时间你的专业度和判断力会被进一步认可，适合处理需要「一锤定音」的事。但国王的位置也有它的孤独：你的标准对自己同样严苛，偶尔允许自己不那么正确一次。赢了道理的人，也要记得给人心留一点温度，那才是长久服众的根基。',rh:'你最近太讲道理了，讲得人心有点凉',rd:'宝剑国王逆位说的是冷酷专断或规则的滥用：你可能在某件事上标准过硬、姿态过冷，明明占理，却把关系推到了对立面；或者反过来，你正被一个只讲规则不讲情面的人压着，憋屈得不行。这张牌的提醒是：规则和道理是用来解决问题的，不是用来赢人的。当你发现「我明明是对的，但事情变糟了」，就是该给道理加点温度的时候了。赢了道理输了人心，这笔账长期算下来是亏的。',ut:'以理服人',rt:'给道理加点温度',g:'一锤定音的判断力',l:'道理要赢，人心也要留住'},
    'pentacles1':{uh:'一颗能生钱的种子，落到你手里了',ud:'星币王牌正位说的是新的物质机会：一份新工作、一个新项目、一条新财路，或者一个把技能变现的点子——它现在还只是一颗种子的大小，但成色是实的。你这段时间的财运关键词是「务实的好开始」：别嫌它小，星币类的机会从来都是滚雪球型的，起步慢、后劲足。接住它，然后用最笨的办法养：定期投入、认真记账、不碰不懂的东西。种子不怕小，怕的是没人浇。',rh:'有个机会刚从你手边溜走',rd:'星币王牌逆位说的是机会错失或财务无规划：可能是一个本来能接住的机会，因为你的犹豫或准备不足，擦肩而过了；或者钱这块你一直没个章法，进多少出多少，全凭感觉。这张牌不打算让你懊悔太久，它指出更要紧的事：先把账理清楚。你连自己的钱去哪了都说不准，再好的机会来了也留不住。今天就开始记，哪怕只记大头——掌控感，是从看清开始的。',ut:'接住种子',rt:'先把账理清',g:'把机会落袋的务实',l:'机会留给账清楚的人，先开始记账'},
    'pentacles2':{uh:'你同时抛着好几个球，手忙但没乱',ud:'星币二正位说的是在多项事务间灵活周旋：钱、时间、两摊事、两种身份——你像个杂耍演员，球都在空中，一个没掉。这份应变能力是你这段时间的真实写照，也确实辛苦。这张牌一边肯定你的手活，一边提醒你：杂耍是应急的姿势，不是长久的日子。球越抛越多的趋势如果不加控制，总有一天要掉。趁现在还能掌控，主动给球做减法，或者找个人帮你接两个。',rh:'球太多了，先放下一个，不然全掉',rd:'星币二逆位说的是失衡过载：你同时扛的事已经超过了手忙脚乱的限度——开始忘事、开始出错、开始哪件都做不好，而且你心里清楚得很。这张牌的建议没有商量余地：今天就砍掉一项。不是最重要的那项，是最耗你、回报最低的那项。砍的时候会肉疼，会觉得「万一呢」——但你要明白，保住全局的方式就是放弃局部。全盘皆落和主动放下一件，你选一个。',ut:'灵活周旋',rt:'主动做减法',g:'多线周旋的应变力',l:'球太多时先放下一个，别等全盘皆落'},
    'pentacles3':{uh:'你的手艺，开始被人认出来了',ud:'星币三正位说的是团队协作与手艺被认可：你做的东西——作品、方案、活儿的质量——正在被懂行的人看见，而且这次不是你一个人单打独斗，是和别人配合着把事做成。这张牌对你是个明确的信号：你适合在协作里发光，找对搭档比闷头苦干重要。你在团队里的角色，是那个「有他在，质量就稳」的人。把这个口碑经营下去，它会变成你最值钱的资产。',rh:'配合有点卡，你的手艺还需要磨',rd:'星币三逆位说的是配合不畅或手艺待打磨：最近一次协作可能让你挺憋气——分工不清、标准不一、或者你觉得自己在给别人擦屁股；也有可能，是你的某个基本功被现实点名了：以前够用的水平，现在不够用了。这张牌建议你两件事一起做：协作的规则在事前讲清，别靠默契硬撑；基本功该补就补，别用「我经验多」挡着。手艺人最后拼的，还是手艺本身。',ut:'在协作里发光',rt:'补基本功讲清规则',g:'靠手艺吃饭的底气',l:'协作先讲规则，手艺别停止打磨'},
    'pentacles4':{uh:'你攥紧的那些东西，是在攒安全感',ud:'星币四正位说的是守成与积累：你最近对钱、对资源、对自己的地盘，看得比平时紧——这不是小气，是一种「好不容易攒下的，不能轻易动」的心态。在经济不确定的时候，这份谨慎是护身符。这张牌肯定你的积累意识，但也轻声提醒一句：攥得太紧的手，是接不住新东西的。该花的——花在提升自己、花在值得的人和体验上——不叫浪费，叫让钱流动起来。守和流之间，你的功课是找到那个比例。',rh:'你对钱的紧张，已经开始影响生活了',rd:'星币四逆位有两副面孔：一是你对金钱的执着过了头，焦虑到影响睡眠和关系，一块钱掰成两半花的背后，是心里那个「不够」的洞；二是到了该花则花的节点，你却迟迟松不开手，错过了本该抓住的东西。两副面孔的解药是同一味：把「安全」的标准定成一个具体的数字。达到了，就允许自己正常生活。模糊的恐惧最耗人，具体的数字最治焦虑。',ut:'守得住才有底气',rt:'把安全感定成数字',g:'积累与守成的耐性',l:'给安全感一个具体数字，别让恐惧无限大'},
    'pentacles5':{uh:'你正处在一段紧日子里，别一个人硬撑',ud:'星币五正位说的是匮乏与困境：钱紧、身体抱恙、或者一种「被落在外面」的孤立感——最近的日子，确实不好过。这张牌不灌鸡汤，它只说两个事实：第一，这段低谷是阶段性的，不是你的命；第二，教堂的灯一直亮着——意思是，求助的渠道其实存在，你只是因为要面子或者不习惯，一直没开口。撑不住的时候开口，不丢人。你帮过的人、能帮你的人，比你以为的多。先把最急的那件说出来。',rh:'困住你的那阵子，正在过去',rd:'星币五逆位说的是走出困境、转机将至：最紧的那段时间，你已经熬过来了——可能是收入有了回音、身体在好转、或者有人实实在在地伸了手。这张牌肯定你这段日子的硬气，也提醒你趁转机站稳：把这次教训变成制度——存一笔应急的钱、把身体的那个信号当回事、把帮过你的人记下来。困境最大的价值，是让你知道下一次该提前准备什么。出门之后，别忘了带伞。',ut:'开口求助不丢人',rt:'把教训变成制度',g:'低谷里不垮的硬气',l:'撑不住时开口，面子不能当饭吃'},
    'pentacles6':{uh:'你的大方，正在变成你的人脉存款',ud:'星币六正位说的是给予与回馈：这段时间，资源的流动对你有利——你帮出去的、送出去的、借出去的，会以意想不到的方式流回来；同时，如果有人向你伸手，给与不给，你心里那杆秤是准的。你这阶段的财运密码是「流动」：钱和情分都是，攥死在手里会发霉，转起来才生息。但这张牌也要你记住分寸：给予要给值得的、给能让你心安的，烂好人的账，最后都是自己还。',rh:'你的人情账，有点算不清了',rd:'星币六逆位说的是施与受失衡：你可能借出去的东西迟迟回不来又不好意思催，也可能你总在接受的一方，心里欠着、别扭着。人情账最怕的就是糊涂账——关系再好，钱和情分混在一起算，最后多半两样都伤。这张牌建议你做个温和的了断：该确认的确认、该还的还、该明说的用不伤感情的方式说清。账清了，关系反而能轻装上阵。',ut:'让资源流动起来',rt:'把人情账算清',g:'得人心的大方',l:'给予要有分寸，烂好人的账要自己还'},
    'pentacles7':{uh:'你种下的那些，还没到收的时候',ud:'星币七正位说的是耐心耕耘、评估收成：你投入了很久的一件事——工作、学习、一段经营了很久的关系——眼下正处在最考验人的阶段：已经花了很多，却还没看到想要的结果，你忍不住怀疑：还要不要继续？这张牌给的是农夫的视角：庄稼在土里的时候，你扒开看一百次，它也不会长得更快。但它支持你做一次冷静的评估：苗是活的，就继续浇；苗已经枯了，及时改种。判断的标准是趋势，不是情绪。',rh:'你投入了很多，却迟迟不见回报',rd:'星币七逆位说的也是投入未见回报，但语气更重：你太执着于「我已经付出了这么多」，哪怕眼前的事已经不太对劲，你也硬撑着不肯收手，怕一放手，之前的投入就全白费了。放在性格上，这正是你的韧性所在，也是你的软肋——有韧性是好事，但容易在不值得的人和事上耗太久，该调整方向的时候反而犹豫。给自己设一个明确的复盘点：到那天，用数据不用感觉决定去留。',ut:'看趋势不看情绪',rt:'设复盘点定去留',g:'长期主义的耐心',l:'别用沉没成本绑住自己，该止损时止损'},
    'pentacles8':{uh:'你靠手艺吃饭的样子，最踏实',ud:'星币八正位说的是专注打磨：你最近进入了一种很好的状态——一件事翻来覆去地做，不厌其烦地抠细节，像个学徒一样认真。这种状态短期内不性感，甚至有点枯燥，但它在悄悄给你攒真正的资本：手艺。这张牌全力肯定你这个方向，并且提醒你把「重复」和「精进」分开：每一遍都要比上一遍多想一点，次数才有意义。等哪天机会来了，你会庆幸这段闷头打磨的日子。',rh:'你最近有点敷衍，自己心里清楚',rd:'星币八逆位说的是敷衍了事或重复无成长：最近的你，做事有点得过且过——流程走完了，魂没跟上；或者日复一日重复同样的动作，熟练是熟练了，但天花板也到了。熟练不等于精进，这是这张牌最想点醒你的。如果敷衍是因为倦了，那就正经休息；如果是因为这件事本身没有成长空间了，那就考虑换个能让你重新「笨拙」起来的地方。一直舒适，一直原地。',ut:'专注打磨',rt:'分清重复与精进',g:'下笨功夫的定力',l:'别让熟练变成停滞，该换地方就换'},
    'pentacles9':{uh:'你现在的生活，是自己一手挣来的',ud:'星币九正位说的是独立与丰盛：一种「我靠自己，也过得很好」的底气——收入、心态、生活品质，都在你自己的掌控里。这段时间你很适合享受成果：给自己买件惦记很久的东西、安排一次只取悦自己的行程。你这个人容易对自己抠、对别人大方，这张牌明确站你自己这边：你挣的，你值得花。独立最迷人的样子，不是拒绝所有人，是你先把自己活成了一个完整的圆，再决定让谁进来。',rh:'物质上不缺了，你心里那块还空着',rd:'星币九逆位说的是过度依赖物质找安全感：你最近可能有点用消费填空洞的意思——买的时候快乐一下，到手就索然无味，然后想买下一个。或者，你把「独立」过成了「拒绝被爱」：什么都自己扛，连示弱都觉得丢人。这张牌想让你分清：安全感的大头从来不是银行卡给的，是稳定的关系、健康的身体和「搞砸了我也能重来」的自信。物资补仓之前，先看看是哪块在漏。',ut:'享受自己挣来的',rt:'先看看哪块在漏',g:'自给自足的底气',l:'安全感不全靠物质，别把独立过成孤立'},
    'pentacles10':{uh:'你想要的长久安稳，有了眉目',ud:'星币十正位说的是家业丰盛与传承：这是一个关于「长久」的图景——稳定的收入来源、和睦的家人、能传下去的东西。你的眼光这段时间自然地放长了：不光想这一笔赚多少，还会想三年后、十年后是什么样。这张牌肯定这个视角的转变，它是你走向成熟的重要标志。适合做长远安排：储蓄计划、家庭大事、技能投资。慢慢来，你走的这条路，终点是一幅安稳富足的图，你已经看到它的轮廓了。',rh:'长远的事，你想得还不够',rd:'星币十逆位说的是家财纷争或规划缺失：可能最近家里为钱、为分工、为某件大事有了点不愉快；或者你自己的长远规划一直是个空白，赚多少花多少，对三年后没有画面感。这张牌的提醒很务实：涉及家人和钱的事，感情再深也要把话说在前面、把规则立在前面，含糊是纠纷的温床。对你个人：哪怕收入不高，也开始为「以后」留一点点。安稳不是想出来的，是提前安排出来的。',ut:'把眼光放长',rt:'规则立在前面',g:'为长远打算的眼光',l:'家人和钱的事，含糊是纠纷的温床'},
    'pentacles11':{uh:'有个务实的好机会，正等你伸手',ud:'星币侍者正位说的是务实的学习者与新机会：一个新工作、新技能、新收入来源的消息正在路上，它的共同特点是「不花哨、很实在」——需要你下笨功夫学、花时间熬，但前景是扎实的。你最近的状态也对路：肯学、肯练、能坐得住。这张牌鼓励你把学生的姿态摆正：别怕问题显得笨，把基础打牢。星币家的机会都讲复利，你现在投入的每一点认真，都会在后面连本带利地回来找你。',rh:'好消息要迟些到，你先别急着摆烂',rd:'星币侍者逆位说的是拖延或好消息延迟：等的那件事比预期来得慢，你的劲儿也跟着泄了一点，开始有点「反正都这样了」的摆烂情绪。这张牌说句公道话：延迟不是取消。趁等消息的这段时间，别干坐着——把该补的技能补上、该准备的材料备齐，等机会真正敲门时，你是那个立刻能接住的人，而不是刚睡醒的人。你的认真不会白费，只是结算日还没到。',ut:'摆正学生姿态',rt:'等待时也别干坐',g:'肯下笨功夫的学习态度',l:'别让等待磨掉劲头，延迟不是取消'},
    'pentacles12':{uh:'你骨子里是个靠谱的行动派',ud:'星币骑士正位说的是稳扎稳打、可靠勤恳。这张牌代表踏实、有耐心、一步一个脚印。你性格里最鲜明的底色就是稳：做事不急躁，愿意花时间把一件事做好；答应别人的事基本不会掉链子，习惯用行动说话而不是光靠嘴。这种特质在工作或需要长期投入的事情上特别突出，身边人也容易把你当成可以依靠的那一个。但这张牌也留了句提醒：稳不等于慢，关键时刻该提速、该变通的时候，别让惯性替你做了决定。',rh:'你稳得有点过了，开始变成固执',rd:'星币骑士逆位说的是固执与惯性：你的踏实最近有点变味——做事按部就班到了机械的程度，路走了一半明明看到有更近的道，你还是沿着老路走，因为「一直是这样做的」。这张牌不是让你丢掉稳，是提醒你偶尔抬起头看看路：方向对不对、效率够不够、有没有新的工具能让你事半功倍。勤恳是美德，但低头拉车之前，先确认车上装的还是不是你要送的东西。',ut:'稳扎稳打',rt:'抬头看看路',g:'答应了就不掉链子的可靠',l:'别让惯性替你决定，稳也要讲方向'},
    'pentacles13':{uh:'你把日子经营得井井有条',ud:'星币王后正位说的是持家有道、务实滋养：你有一种把资源安排得妥妥当当的本事——钱知道怎么花，时间知道怎么分，身边人到了你这儿，总能被照顾到。这份能力听起来平常，其实是过日子的顶级天赋。这段时间你会是很多人的后盾，但这张牌特意要跟你说一句：操劳的人最容易忽略自己。把你给别人的那份用心，分一成出来给自己——吃好点、睡好点、任性一次。你稳，整个盘子才稳。',rh:'你操劳太过了，也该被照顾一次',rd:'星币王后逆位说的是操劳过度、忽略自己：你最近像一个不停转的陀螺——家里的、工作上的、别人的事，一件接一件，你把自己排在了所有事的最后。身体已经有点意见了，情绪也比平时脆。这张牌的态度很直接：你不是铁打的，而且你倒下的时候，那些靠你转的事会一起停摆。把「照顾自己」当成一件正事排进日程，学会把一部分事分出去、推掉、或者降低标准。被照顾一次，不丢人。',ut:'井井有条',rt:'把自己也排进日程',g:'把日子经营好的天赋',l:'别总把自己排在最后，你倒下盘子会停'},
    'pentacles14':{uh:'你是要做成大事的人，根基已经在打了',ud:'星币国王正位说的是事业有成与资源雄厚：这是一个掌舵者的位置——看得清大局、调得动资源、对结果负责。你这段时间在事业和财务上的判断，值得自己信任：你对「什么值得长期投入」的嗅觉越来越准了。这张牌也提醒你把格局再放大一点：真正的富足不只是账户数字，是你能为身边人提供多少庇护和机会。你正在从「让自己过好」走向「带着一群人过好」，这是段位的变化。',rh:'你最近有点太看重结果和数字了',rd:'星币国王逆位说的是唯利是图或固步自封：最近你可能在某件事上算计得有点过头——什么都先问回报，把一些不能拿钱衡量的东西也标了价；或者反过来，守着已有的成绩不敢再动，怕输掉现在的安稳。这张牌提醒你：格局决定结局。算账是本事，但只会算小账的人，成不了大气候；而守成守到不敢进取，家底也会慢慢被时代稀释。把眼光从这一笔的得失，移到三年后的位置上。',ut:'掌舵者格局',rt:'眼光移到三年后',g:'调动资源成事的能力',l:'别只算小账，格局决定结局'}
    };
    /* 把深度解读合并进牌组 */
    DECK.forEach(function(c){
      var d = DEEP[cardKey(c)];
      if (d){ c.uh = d.uh; c.ud = d.ud; c.rh = d.rh; c.rd = d.rd; c.ut = d.ut; c.rt = d.rt; c.g = d.g; c.l = d.l; }
    });
    </script>
    <script>
    /* ================= 牌阵定义 ================= */
    var SPREADS = [
      {id:'single', name:'每日单张', count:1, desc:'快速指引，看清当下最重要的一件事', layout:'row',
       positions:[{name:'核心指引', hint:'这张牌点出你此刻最该留意的事——先抓住它，其余的自然会顺。'}]},
      {id:'three', name:'时间之流 · 三张', count:3, desc:'过去、现在、未来，适合问一件事的来龙去脉', layout:'row',
       positions:[
         {name:'过去', hint:'事情的来处：已经发生、仍在影响你的因素。'},
         {name:'现在', hint:'你此刻真实的处境与心境。'},
         {name:'未来', hint:'按现在的轨迹走下去，最可能抵达的方向。'}]},
      {id:'cross5', name:'十字牌阵 · 五张', count:5, desc:'现状、挑战与建议，适合要做决定的事', layout:'cross5',
       positions:[
         {name:'现状', area:'center', hint:'这件事的核心处境，一切解读的原点。'},
         {name:'挑战', area:'top', hint:'横在你面前的最大阻碍，或你最不愿面对的那部分。'},
         {name:'过去影响', area:'left', hint:'仍在暗中作用的过往因素。'},
         {name:'未来趋势', area:'right', hint:'局势正在滑向的方向。'},
         {name:'建议', area:'bottom', hint:'牌给你的行动建议——这一张最值得听。'}]},
      {id:'relation', name:'关系牌阵 · 六张', count:6, desc:'你、对方与这段关系的走向，适合感情与合作', layout:'row',
       positions:[
         {name:'你', hint:'你在这段关系里的真实状态与心意。'},
         {name:'对方', hint:'对方目前的状态与态度。'},
         {name:'关系现状', hint:'你们之间现在的真实氛围。'},
         {name:'彼此的连接', hint:'把你们连在一起的东西：缘分、默契或共同课题。'},
         {name:'障碍', hint:'横在你们之间的问题所在。'},
         {name:'关系走向', hint:'这段关系最可能去往的方向。'}]},
      {id:'celtic', name:'凯尔特十字 · 十张', count:10, desc:'最经典的完整牌阵，把一件事从里到外看透', layout:'celtic',
       positions:[
         {name:'现状', area:'one', hint:'问题的核心处境。'},
         {name:'挑战', area:'cross', hint:'直接横在核心之上的阻力或转机。'},
         {name:'过去', area:'three', hint:'刚刚过去、仍在影响局势的因素。'},
         {name:'根基', area:'four', hint:'潜意识与深层根源：事情真正的地基。'},
         {name:'目标', area:'five', hint:'你意识里想抵达的最好结果。'},
         {name:'未来', area:'six', hint:'即将到来的发展。'},
         {name:'自我态度', area:'seven', hint:'你面对这件事的姿态与立场。'},
         {name:'环境影响', area:'eight', hint:'周围的人与环境如何作用于你。'},
         {name:'希望与恐惧', area:'nine', hint:'你最盼望的，也恰是你最怕的。'},
         {name:'最终结果', area:'ten', hint:'综合所有因素后，最可能的结局。'}]}
    ];
    var THEMES = ['综合','爱情','事业','财运','学业','健康'];
    var state = {theme:'综合', spread:SPREADS[1], drawn:[], flipped:0, done:false};
    var readingLog = [];

    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function shuffleArr(a){
      for (var i = a.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    /* ================= 主题与牌阵选择 ================= */
    function renderThemes(){
      $('themeChips').innerHTML = THEMES.map(function(t){
        return '<button type="button" class="chip' + (state.theme === t ? ' on' : '') + '" data-theme="' + t + '">' + t + '</button>';
      }).join('');
      Array.prototype.forEach.call($('themeChips').children, function(b){
        b.addEventListener('click', function(){ state.theme = b.getAttribute('data-theme'); renderThemes(); });
      });
    }
    function renderSpreads(){
      $('spreadGrid').innerHTML = SPREADS.map(function(s){
        return '<button type="button" class="spread-opt' + (state.spread.id === s.id ? ' on' : '') + '" data-id="' + s.id + '">' +
          '<span class="s-name">' + s.name.split(' · ')[0] + '</span><span class="s-count">' + s.count + ' 张</span>' +
          '<span class="s-desc" style="display:block">' + s.desc + '</span></button>';
      }).join('');
      Array.prototype.forEach.call($('spreadGrid').children, function(b){
        b.addEventListener('click', function(){
          for (var i = 0; i < SPREADS.length; i++) if (SPREADS[i].id === b.getAttribute('data-id')) state.spread = SPREADS[i];
          renderSpreads();
        });
      });
      $('spreadNote').textContent = '已选「' + state.spread.name + '」：' + state.spread.positions.map(function(p){ return p.name; }).join(' · ');
    }

    /* ================= 抽牌流程 ================= */
    function startReading(){
      var q = $('qInput').value.trim();
      var spread = state.spread;
      var pool = shuffleArr(DECK.slice());
      state.drawn = pool.slice(0, spread.count).map(function(c){
        return {card:c, reversed: Math.random() < 0.38};
      });
      state.flipped = 0; state.done = false;
      state.question = q;
      $('reading').hidden = true;
      $('stage').hidden = false;
      $('stageTitle').textContent = spread.name;
      $('stageQ').innerHTML = q ? '你的问题：<b>「' + esc(q) + '」</b> · 主题：' + state.theme : '主题：' + state.theme + ' · 问问近期的整体走向';
      $('board').innerHTML = '';
      $('board').className = 'board';
      $('stageTip').hidden = true;
      $('shuffleBox').hidden = false;
      $('dstack').innerHTML = backHTML() + backHTML() + backHTML();
      Array.prototype.forEach.call($('dstack').children, function(el){ el.classList.add('bk'); el.style.position = 'absolute'; el.style.inset = '0'; });
      $('dstack').classList.add('shuffling');
      $('stage').scrollIntoView({behavior:'smooth', block:'start'});
      setTimeout(function(){
        $('shuffleBox').hidden = true;
        buildBoard();
        $('stageTip').hidden = false;
      }, 1500);
    }
    function buildBoard(){
      var spread = state.spread;
      var board = $('board');
      board.className = 'board ' + spread.layout;
      var html = '';
      if (spread.layout === 'celtic'){
        var byArea = {};
        spread.positions.forEach(function(p, i){ byArea[p.area] = i; });
        html += slotHTML(byArea.three, 'three');
        /* 中心格: 现状 + 横置挑战 */
        var ci = byArea.one, xi = byArea.cross;
        html += '<div class="slot celtic-center" style="grid-area:one">' +
          '<span class="pos">' + spread.positions[ci].name + ' · ' + spread.positions[xi].name + '</span>' +
          tcardHTML(state.drawn[ci].card, {}) +
          '<span class="cname" data-cname="' + ci + '"></span>' +
          '<div class="cross-card">' + tcardHTML(state.drawn[xi].card, {}) + '</div>' +
          '<span class="cname" data-cname="' + xi + '" style="margin-top:2px"></span>' +
        '</div>';
        ['five','four','six','seven','eight','nine','ten'].forEach(function(a){ html += slotHTML(byArea[a], a); });
      } else if (spread.layout === 'cross5'){
        spread.positions.forEach(function(p, i){ html += slotHTML(i, p.area); });
      } else {
        spread.positions.forEach(function(p, i){ html += slotHTML(i, null); });
      }
      board.innerHTML = html;
      var cards = board.querySelectorAll('.tcard');
      Array.prototype.forEach.call(cards, function(btn){
        btn.addEventListener('click', function(){
          if (btn.classList.contains('flipped')) { openModal(state.drawn[+btn.getAttribute('data-draw')].card); return; }
          flipCard(btn);
        });
      });
      /* 给每张牌标记它对应第几张抽牌 */
      assignDrawIndices(board);
    }
    function assignDrawIndices(board){
      var spread = state.spread;
      var cards = board.querySelectorAll('.tcard');
      if (spread.layout === 'celtic'){
        /* 顺序: 过去(0位slot) 中心 现状 挑战, 然后 five..ten */
        var order = [2, 0, 1, 4, 3, 5, 6, 7, 8, 9];
        Array.prototype.forEach.call(cards, function(btn, i){ btn.setAttribute('data-draw', order[i]); });
      } else {
        Array.prototype.forEach.call(cards, function(btn, i){ btn.setAttribute('data-draw', i); });
      }
      Array.prototype.forEach.call(cards, function(btn){
        var d = state.drawn[+btn.getAttribute('data-draw')];
        if (d.reversed) btn.querySelector('.face.front').classList.add('is-rev');
      });
    }
    function slotHTML(i, area){
      var p = state.spread.positions[i];
      var style = area ? ' style="grid-area:' + area + '"' : '';
      return '<div class="slot"' + style + '><span class="pos">' + p.name + '</span>' +
        tcardHTML(state.drawn[i].card, {}) +
        '<span class="cname" data-cname="' + i + '"></span></div>';
    }
    function flipCard(btn){
      var i = +btn.getAttribute('data-draw');
      var d = state.drawn[i];
      btn.classList.add('flipped');
      btn.setAttribute('aria-label', d.card.cn + (d.reversed ? ' 逆位' : ' 正位'));
      var label = document.querySelector('[data-cname="' + i + '"]');
      if (label) label.textContent = d.card.cn + (d.reversed ? ' · 逆位' : ' · 正位');
      state.flipped++;
      if (state.flipped >= state.drawn.length && !state.done){
        state.done = true;
        setTimeout(showReading, 650);
      }
    }
    function flipAll(){
      Array.prototype.forEach.call($('board').querySelectorAll('.tcard:not(.flipped)'), function(btn, k){
        setTimeout(function(){ flipCard(btn); }, k * 160);
      });
    }

    /* ================= 解读 ================= */
    /* ================= 组合解读（总判 / 启示 / 金句） ================= */
    var EL_PERSONA = {
      '火':'行动先行、靠一股劲儿往前冲',
      '水':'重感情、凭感受做判断',
      '风':'脑子转得快、靠想通了才肯动',
      '土':'踏实务实、靠积累和行动说话'
    };
    var EL_THEME_SENT = {
      '火':'这组牌里火气最旺，整件事的引擎是行动和热情——很多结，想是想不开的，做着做着就开了。',
      '水':'这组牌里水气最重，情感和关系是整件事的暗线——先处理感受，再处理事情，顺序反了全是白费。',
      '风':'这组牌里风气最盛，关键全在信息和沟通上——把事实核对准、把话说清楚，局势就会自己变。',
      '土':'这组牌里土气最厚，拼的是现实基本盘——钱、时间、身体和耐心，哪一样虚了，整件事都立不住。'
    };
    var OPEN_Q = {
      '综合':'要不要顺着这条线，再看看接下来一个月，你最该把力气花在哪一件事上？',
      '爱情':'要不要再看看，在这段关系里，对方心里最没说出口的那句话是什么？',
      '事业':'要不要再看看，挡在你和下一步之间的那个人或那件事，到底是什么？',
      '财运':'要不要再看看，接下来这一季，你的钱最该往哪儿流、又最该避开哪个坑？',
      '学业':'要不要再看看，真正拖住你成绩的，是方法、状态，还是心态？',
      '健康':'要不要再看看，你的身体最想让你先改掉的，是哪一个习惯？'
    };
    function coreIndex(){
      var names = ['现状','关系现状','现在','核心指引'];
      for (var k = 0; k < names.length; k++){
        for (var i = 0; i < state.spread.positions.length; i++){
          if (state.spread.positions[i].name === names[k]) return i;
        }
      }
      return 0;
    }
    function analyzeDraw(){
      var drawn = state.drawn, total = drawn.length;
      var majors = drawn.filter(function(d){ return d.card.kind === 'major'; }).length;
      var revs = drawn.filter(function(d){ return d.reversed; }).length;
      var els = {'火':0,'水':0,'风':0,'土':0};
      drawn.forEach(function(d){ els[d.card.el]++; });
      var domEl = '火', domN = -1;
      Object.keys(els).forEach(function(k){ if (els[k] > domN){ domN = els[k]; domEl = k; } });
      var ci = Math.min(coreIndex(), total - 1);
      var core = drawn[ci];
      var last = drawn[total - 1];
      /* ---- 总判 ---- */
      var tension;
      if (total === 1){
        tension = core.reversed ? '而眼下这股劲儿正卡在半路，心里有数，却迟迟使不出来' : '而眼下，这股劲儿正顺着往外走，是可以借势的时机';
      } else if (revs === 0){
        tension = '而这一次，几张牌难得地同向——能量是顺的，少有内耗';
      } else if (revs > total / 2){
        tension = '但这一阵你的内在状态先卡住了，很多事不是难在事上，是难在你身上';
      } else if (core.reversed){
        tension = '但你此刻所处的位置偏偏有点别着劲，顺势的事做起来也打折';
      } else {
        tension = '只是顺风里夹着一两处逆风，卡点很具体，不在全局';
      }
      var verdict = '你是一个' + EL_PERSONA[domEl] + '的人，' + tension + '。';
      /* ---- 总判展开（约 80–120 字） ---- */
      function clauseOf(d){
        var s = ((d.reversed ? d.card.rd : d.card.ud) || (d.reversed ? d.card.rev : d.card.up)).split('。')[0];
        s = s.replace(/^.*?说的是/, '').replace(/^.*?说的也是/, '');
        var before = s.split('：')[0];
        if (before.length >= 10) s = before;
        if (s.length > 42) s = s.slice(0, 42) + '…';
        return s;
      }
      var parts = [];
      parts.push('核心位置上是' + core.card.cn + '（' + (core.reversed ? '逆位' : '正位') + '），它给整组牌定了调：' + clauseOf(core) + '。');
      if (total >= 3){
        if (majors === 0) parts.push('全是小阿卡纳，说明这不是命运层面的大事，而是日常里的具体处境——具体，就意味着可操作。');
        else if (majors / total >= 0.5) parts.push('大阿卡纳占了多数（' + majors + '/' + total + '），牵动的已不只是一时得失，而是更长线的人生课题。');
        else parts.push('大阿卡纳 ' + majors + ' 张藏在日常事务里，它所在的位置就是整件事的题眼。');
      }
      parts.push(EL_THEME_SENT[domEl]);
      if (total >= 5 && last !== core){
        parts.push('牌面最后落在' + last.card.cn + '上——' + clauseOf(last) + '，这是走向的关键。');
      }
      /* ---- 关键启示 ---- */
      var tips = [], seen = {};
      drawn.forEach(function(d){
        var t = d.reversed ? d.card.rt : d.card.ut;
        if (t && !seen[t]){ seen[t] = 1; tips.push(t); }
      });
      /* ---- 本事与功课 ---- */
      var giftD = null, lessonD = null, i, d;
      for (i = 0; i < total; i++){ d = drawn[i]; if (!d.reversed && d.card.kind === 'major'){ giftD = d; break; } }
      if (!giftD) for (i = 0; i < total; i++){ if (!drawn[i].reversed){ giftD = drawn[i]; break; } }
      if (!giftD) giftD = core;
      var chalIdx = -1;
      state.spread.positions.forEach(function(p, idx){ if (p.name === '挑战' || p.name === '障碍') chalIdx = idx; });
      if (chalIdx >= 0 && drawn[chalIdx]) lessonD = drawn[chalIdx];
      if (!lessonD) for (i = 0; i < total; i++){ if (drawn[i].reversed){ lessonD = drawn[i]; break; } }
      if (!lessonD) lessonD = last;
      return {verdict:verdict, verdictText:parts.join(''), insights:tips.slice(0, 3),
        gift:(giftD.card.g || ''), lesson:(lessonD.card.l || ''),
        giftCard:giftD.card.cn, lessonCard:lessonD.card.cn};
    }

    /* ================= 解读呈现 ================= */
    function showReading(){
      var spread = state.spread, theme = state.theme;
      var a = analyzeDraw();
      var html = '<div class="verdict"><div class="v-label">总 判</div>' +
        '<div class="v-main">' + esc(a.verdict) + '</div><p>' + esc(a.verdictText) + '</p></div>';
      if (a.insights.length){
        html += '<p class="insights"><b>关键启示</b>' + a.insights.map(esc).join(' ｜ ') + '</p>';
      }
      state.drawn.forEach(function(d, i){
        var c = d.card, p = spread.positions[i];
        var headline = d.reversed ? c.rh : c.uh;
        var deep = d.reversed ? c.rd : c.ud;
        var kw = d.reversed ? c.rkw : c.kw;
        html += '<div class="rrow">' +
          '<div class="mini">' + tcardHTML(c, {static:true, reversed:d.reversed}) + '</div>' +
          '<div class="r-body">' +
            '<div class="r-pos">' + p.name + ' · ' + p.hint + '</div>' +
            '<div class="r-headline">' + c.cn + (d.reversed ? '逆位' : '正位') + '<span class="r-sep">｜</span>' + esc(headline || '') + '</div>' +
            '<div class="r-kw">关键词：' + kw.join(' · ') + '</div>' +
            '<p>' + esc(deep || (d.reversed ? c.rev : c.up)) + '</p>' +
            (c.theme[theme] ? '<p class="r-theme"><b>放到「' + theme + '」上看：</b>' + c.theme[theme] + '</p>' : '') +
            '<button type="button" class="linklike" data-detail="' + cardKey(c) + '">查看「' + c.cn + '」详解</button>' +
          '</div></div>';
      });
      $('readingList').innerHTML = html;
      Array.prototype.forEach.call($('readingList').querySelectorAll('[data-detail]'), function(b){
        b.addEventListener('click', function(){ openModal(cardByKey(b.getAttribute('data-detail'))); });
      });
      $('summaryBox').innerHTML = '<h3>收束</h3>' +
        '<p class="advice">你最大的本事，是' + esc(a.gift) + '（' + a.giftCard + '）；最大的功课，是' + esc(a.lesson) + '（' + a.lessonCard + '）。</p>' +
        '<p class="openq">' + OPEN_Q[theme] + '</p>';
      $('reading').hidden = false;
      $('reading').scrollIntoView({behavior:'smooth', block:'start'});
      pushHistory();
    }
    function pushHistory(){
      var now = new Date();
      var hh = ('0' + now.getHours()).slice(-2), mm = ('0' + now.getMinutes()).slice(-2);
      readingLog.unshift({
        time: (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + hh + ':' + mm,
        q: state.question, theme: state.theme, spread: state.spread.name,
        cards: state.drawn.map(function(d, i){
          return state.spread.positions[i].name + '·' + d.card.cn + (d.reversed ? '（逆）' : '');
        }).join('，')
      });
      $('historyList').innerHTML = readingLog.map(function(h){
        return '<div class="hrow"><div class="h-meta">' + h.time + ' · ' + esc(h.spread) + ' · 主题：' + h.theme + '</div>' +
          (h.q ? '<div class="h-q">「' + esc(h.q) + '」</div>' : '<div class="h-q">整体运势</div>') +
          '<div class="h-cards">' + esc(h.cards) + '</div></div>';
      }).join('');
    }

    /* ================= 牌库 ================= */
    var libFilter = 'all', libQuery = '';
    function renderLibChips(){
      var opts = [['all','全部'],['major','大阿卡纳'],['wands','权杖'],['cups','圣杯'],['swords','宝剑'],['pentacles','星币']];
      $('libChips').innerHTML = opts.map(function(o){
        return '<button type="button" class="chip' + (libFilter === o[0] ? ' on' : '') + '" data-f="' + o[0] + '">' + o[1] + '</button>';
      }).join('');
      Array.prototype.forEach.call($('libChips').children, function(b){
        b.addEventListener('click', function(){ libFilter = b.getAttribute('data-f'); renderLibChips(); renderLib(); });
      });
    }
    function renderLib(){
      var list = DECK.filter(function(c){
        if (libFilter === 'major' && c.kind !== 'major') return false;
        if (['wands','cups','swords','pentacles'].indexOf(libFilter) >= 0 && c.suit !== libFilter) return false;
        if (libQuery){
          var hay = c.cn + c.en + c.kw.join('') + c.rkw.join('');
          if (hay.toLowerCase().indexOf(libQuery.toLowerCase()) < 0) return false;
        }
        return true;
      });
      $('libGrid').innerHTML = list.map(function(c){
        return '<div class="lib-item">' + tcardHTML(c, {static:true}) + '<div class="li-name">' + c.cn + '</div></div>';
      }).join('');
      $('libEmpty').hidden = list.length > 0;
      Array.prototype.forEach.call($('libGrid').querySelectorAll('.tcard'), function(b){
        b.addEventListener('click', function(){ openModal(cardByKey(b.getAttribute('data-key'))); });
      });
    }

    /* ================= 详解弹窗 ================= */
    function openModal(c){
      if (!c) return;
      var themeRows = '';
      if (c.kind === 'major'){
        themeRows = ['爱情','事业','财运','学业','健康'].map(function(t){
          return '<h4>' + t + '</h4><p>' + c.theme[t] + '</p>';
        }).join('');
      } else {
        themeRows = '<h4>各主题提示</h4><p>' + ['爱情','事业','财运','学业','健康'].map(function(t){
          return '<b>' + t + '：</b>' + c.theme[t];
        }).join('<br>') + '</p>';
      }
      $('modalBody').innerHTML = '<div class="m-in">' +
        '<div class="m-card">' + tcardHTML(c, {static:true}) + '</div>' +
        '<div class="m-body">' +
          '<h3>' + c.cn + '</h3><div class="m-en">' + c.en + '</div>' +
          (c.desc ? '<p>' + c.desc + '</p>' : '') +
          '<h4>正位 · 关键词</h4><div class="kwchips">' + c.kw.map(function(k){ return '<span>' + k + '</span>'; }).join('') + '</div>' +
          (c.uh ? '<p style="font-family:\'Noto Serif SC\',serif;font-weight:700;margin-bottom:6px">' + esc(c.uh) + '</p>' : '') +
          '<p>' + esc(c.ud || c.up) + '</p>' +
          '<h4>逆位 · 关键词</h4><div class="kwchips">' + c.rkw.map(function(k){ return '<span>' + k + '</span>'; }).join('') + '</div>' +
          (c.rh ? '<p style="font-family:\'Noto Serif SC\',serif;font-weight:700;margin-bottom:6px">' + esc(c.rh) + '</p>' : '') +
          '<p>' + esc(c.rd || c.rev) + '</p>' +
          themeRows +
          '<div class="m-meta">' + (c.kind === 'major' ? '大阿卡纳 · ' + c.astro + ' · ' + c.el + '元素' : '小阿卡纳 · ' + c.astro) + '</div>' +
        '</div></div>';
      $('modal').hidden = false;
      document.body.style.overflow = 'hidden';
      Array.prototype.forEach.call($('modalBody').querySelectorAll('.tcard'), function(b){
        b.addEventListener('click', function(){});
        b.style.cursor = 'default';
      });
    }
    function closeModal(){ $('modal').hidden = true; document.body.style.overflow = ''; }
    $('modalX').addEventListener('click', closeModal);
    $('modal').addEventListener('click', function(e){ if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

    /* ================= 每日一抽 ================= */
    function dailyCard(){
      var now = new Date();
      var seedStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
      var h = 0;
      for (var i = 0; i < seedStr.length; i++){ h = (h * 31 + seedStr.charCodeAt(i)) >>> 0; }
      var c = DECK[h % 78];
      var reversed = ((h >> 5) % 100) < 38;
      var box = $('dailyCard');
      box.innerHTML = tcardHTML(c, {});
      var btn = box.querySelector('.tcard');
      btn.addEventListener('click', function(){
        if (!btn.classList.contains('flipped')){
          btn.classList.add('flipped');
          if (reversed) btn.querySelector('.face.front').classList.add('is-rev');
          var first = (reversed ? c.rev : c.up).split('。')[0] + '。';
          $('dailyName').textContent = c.cn + ' · ' + (reversed ? '逆位' : '正位');
          $('dailyText').textContent = first;
          var luckyColor = {'火':'红 / 橙色','水':'蓝 / 青色','风':'米白 / 浅黄色','土':'棕 / 墨绿色'}[c.el];
          var luckyNum = c.kind === 'major' ? (c.idx % 9) + 1 : c.rank;
          $('dailyLucky').innerHTML = '幸运色 <b>' + luckyColor + '</b> · 幸运数字 <b>' + luckyNum + '</b>';
        } else {
          openModal(c);
        }
      });
    }

    /* ================= 初始化 ================= */
    $('btnStart').addEventListener('click', startReading);
    $('btnAgain').addEventListener('click', startReading);
    $('btnFlipAll').addEventListener('click', flipAll);
    $('btnNew').addEventListener('click', function(){
      $('reading').hidden = true; $('stage').hidden = true;
      $('askPanel').scrollIntoView({behavior:'smooth', block:'start'});
    });
    $('libSearch').addEventListener('input', function(){ libQuery = this.value.trim(); renderLib(); });
    renderThemes();
    renderSpreads();
    renderLibChips();
    renderLib();
    dailyCard();
    </script>
  </body>
</html>
