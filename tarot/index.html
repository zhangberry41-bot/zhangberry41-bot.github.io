<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>塔罗占卜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#f4ecd8;
        --bg-deep:#ece0c4;
        --ink:#2d2314;
        --muted:#7d6c4c;
        --gold:#a37c2a;
        --gold-soft:#c9a44a;
        --gold-tint:rgba(163,124,42,.10);
        --accent:#7c2d3e;
        --panel:#fffaf0;
        --panel-line:#ddcda6;
        --face:#fffdf6;
        --face-ink:#33270f;
        --back-bg:#26355e;
        --back-line:#c9a44a;
        --chip-bg:#fbf4e2;
        --shadow:0 10px 30px rgba(93,70,20,.14);
        --star-op:.16;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#12101f;
          --bg-deep:#0d0b18;
          --ink:#ece4cf;
          --muted:#a79cc0;
          --gold:#d3ab55;
          --gold-soft:#e3c078;
          --gold-tint:rgba(211,171,85,.12);
          --accent:#d08a96;
          --panel:#1b1730;
          --panel-line:#3a3358;
          --face:#241d42;
          --face-ink:#f0e7cd;
          --back-bg:#1d2a52;
          --back-line:#d3ab55;
          --chip-bg:#221c3e;
          --shadow:0 12px 34px rgba(0,0,0,.45);
          --star-op:.55;
        }
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;
        background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
        color:var(--ink);
        font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        font-size:15.5px;
        line-height:1.65;
        min-height:100vh;
      }
      body::before{
        content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--star-op);
        background-image:
          radial-gradient(1.6px 1.6px at 22px 34px, var(--gold) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 130px 96px, var(--gold) 50%, transparent 51%),
          radial-gradient(1px 1px at 74px 150px, var(--gold) 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 188px 44px, var(--gold) 50%, transparent 51%);
        background-size:220px 220px;
      }
      .wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:26px 18px 60px}
      h1,h2,h3{font-family:"Noto Serif SC",serif;margin:0}
      .muted{color:var(--muted)}
      .small{font-size:12.5px}

      /* ---------- hero ---------- */
      .hero{display:flex;gap:22px;align-items:stretch;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
      .hero-t{flex:1 1 340px;display:flex;flex-direction:column;justify-content:center;padding:8px 2px}
      .hero-t h1{font-size:40px;font-weight:900;letter-spacing:.06em;line-height:1.15}
      .hero-t h1 .en{display:block;font-family:"Cinzel",serif;font-size:13px;font-weight:600;letter-spacing:.42em;color:var(--gold);margin-top:8px}
      .hero-t .sub{margin:14px 0 0;color:var(--muted);max-width:30em}
      .daily{flex:0 1 400px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:16px;align-items:center}
      .daily .d-info{flex:1;min-width:0}
      .daily .d-label{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:700}
      .daily .d-name{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700;margin:2px 0}
      .daily .d-text{font-size:13.5px;color:var(--muted);margin:0}
      .daily .d-lucky{margin-top:8px;font-size:12.5px;color:var(--ink)}
      .daily .d-lucky b{color:var(--gold);font-weight:700}
      #dailyCard{--cw:76px;flex:0 0 auto}

      /* ---------- panels ---------- */
      .panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
      .panel h2{font-size:21px;font-weight:700;margin-bottom:14px}
      .flabel{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
      .flabel:first-of-type{margin-top:0}
      textarea{
        width:100%;border:1px solid var(--panel-line);border-radius:12px;background:var(--chip-bg);
        color:var(--ink);font:inherit;font-size:15px;padding:11px 13px;resize:vertical;min-height:52px;outline:none;
      }
      textarea:focus{border-color:var(--gold)}
      .chips{display:flex;flex-wrap:wrap;gap:8px}
      .chip{
        border:1px solid var(--panel-line);background:var(--chip-bg);color:var(--ink);
        border-radius:999px;padding:6px 15px;font:inherit;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s;
      }
      .chip:hover{border-color:var(--gold)}
      .chip.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
      @media (prefers-color-scheme: dark){ .chip.on{color:#221a05} }

      .spreads{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
      .spread-opt{
        text-align:left;border:1px solid var(--panel-line);background:var(--chip-bg);border-radius:14px;
        padding:13px 14px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,background .15s;position:relative;
      }
      .spread-opt:hover{border-color:var(--gold)}
      .spread-opt.on{border-color:var(--gold);background:var(--gold-tint);box-shadow:inset 0 0 0 1px var(--gold)}
      .spread-opt .s-name{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16.5px}
      .spread-opt .s-count{position:absolute;top:11px;right:13px;font-size:11.5px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 8px;line-height:1.7}
      .spread-opt .s-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
      .spread-note{font-size:13px;color:var(--muted);margin:12px 0 0;min-height:1.4em}

      .actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
      .btn{
        border:1px solid var(--panel-line);background:var(--chip-bg);color:var(--ink);
        border-radius:12px;padding:10px 20px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
      }
      .btn:hover{border-color:var(--gold)}
      .btn:active{transform:scale(.97)}
      .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
      @media (prefers-color-scheme: dark){ .btn.primary{color:#221a05} }
      .btn.big{font-size:16.5px;padding:13px 30px;border-radius:14px}
      .btn.ghost{background:transparent}

      /* ---------- stage ---------- */
      .stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
      .stage-head h2{margin:0}
      .stage-btns{display:flex;gap:8px;flex-wrap:wrap}
      .stage-q{color:var(--muted);font-size:14px;margin:8px 0 4px}
      .stage-q b{color:var(--ink)}
      .stage-tip{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}
      #shuffleBox{padding:26px 0 8px;text-align:center}
      .dstack{position:relative;width:104px;height:166px;margin:0 auto 14px}
      .dstack .bk{position:absolute;inset:0;border-radius:9px}
      .dstack .bk:nth-child(1){transform:translate(-7px,3px) rotate(-4deg)}
      .dstack .bk:nth-child(2){transform:translate(7px,-2px) rotate(3deg)}
      .dstack .bk:nth-child(3){transform:none}
      .shuffling .bk:nth-child(1){animation:shA .22s ease-in-out infinite alternate}
      .shuffling .bk:nth-child(2){animation:shB .19s ease-in-out infinite alternate}
      .shuffling .bk:nth-child(3){animation:shC .26s ease-in-out infinite alternate}
      @keyframes shA{from{transform:translate(-16px,2px) rotate(-9deg)}to{transform:translate(2px,-3px) rotate(2deg)}}
      @keyframes shB{from{transform:translate(15px,-3px) rotate(8deg)}to{transform:translate(-2px,3px) rotate(-2deg)}}
      @keyframes shC{from{transform:translate(0,-7px) rotate(0deg)}to{transform:translate(0,5px) rotate(1deg)}}
      #shuffleBox p{color:var(--muted);font-size:14px;margin:0}

      .board{--cw:104px;display:flex;flex-wrap:wrap;gap:20px 16px;justify-content:center;padding:20px 4px 6px}
      .board.cross5{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". top ." "left center right" ". bottom .";width:100%;max-width:480px;margin:0 auto;gap:18px 14px}
      .board.celtic{display:grid;grid-template-columns:repeat(4,1fr);grid-template-areas:". five . ten" "three one six nine" ". four . eight" ". . . seven";width:100%;max-width:600px;margin:0 auto;gap:18px 12px}
      .board.cross5 .tcard,.board.celtic .tcard{width:100%}
      @media (max-width:560px){
        .board{--cw:96px}
        .board.celtic{gap:14px 8px}
      }
      .slot{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
      .slot .pos{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.14em;text-align:center}
      .slot .cname{font-size:12px;color:var(--muted);text-align:center;min-height:1.3em;line-height:1.3}
      .celtic-center{position:relative}
      .celtic-center .cross-card{position:absolute;top:46%;left:50%;width:78%;z-index:3;transform:translate(-50%,-50%) rotate(90deg)}
      .celtic-center .cross-card .tcard{width:100%}

      /* ---------- tarot card ---------- */
      .tcard{width:var(--cw,104px);aspect-ratio:5/8;perspective:1000px;background:none;border:none;padding:0;cursor:pointer;display:block;container-type:inline-size}
      .tcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.25,.7,.3,1)}
      .tcard.flipped .in{transform:rotateY(180deg)}
      .tcard.static{cursor:pointer;perspective:none}
      .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden}
      .face.front{transform:rotateY(180deg)}
      .tcard.static .face.front{transform:none;position:relative;height:100%}
      .cardback{
        background:
          radial-gradient(circle at 50% 42%, rgba(201,164,74,.28) 0 26%, transparent 27%),
          repeating-linear-gradient(45deg, rgba(201,164,74,.13) 0 2px, transparent 2px 9px),
          repeating-linear-gradient(-45deg, rgba(201,164,74,.13) 0 2px, transparent 2px 9px),
          var(--back-bg);
        border:1px solid var(--back-line);
        box-shadow:inset 0 0 0 4px var(--back-bg), inset 0 0 0 5.5px var(--back-line);
        display:flex;align-items:center;justify-content:center;color:var(--back-line);
      }
      .cardback svg{width:52%;height:auto;opacity:.95}
      .cardface{
        background:linear-gradient(165deg,var(--face) 0%,var(--face) 70%,var(--gold-tint) 130%);
        border:1px solid var(--gold);color:var(--face-ink);
        box-shadow:inset 0 0 0 3px var(--face), inset 0 0 0 4px var(--gold-soft);
        display:flex;flex-direction:column;padding:8% 7% 7%;
      }
      .revwrap{display:flex;flex-direction:column;height:100%;width:100%}
      .is-rev .revwrap{transform:rotate(180deg)}
      .cf-top{display:flex;justify-content:space-between;align-items:baseline;font-family:"Cinzel",serif;font-weight:600;font-size:12.5cqw;color:var(--gold);line-height:1}
      .cf-top .el{font-family:"Noto Sans SC",sans-serif;font-size:10cqw;letter-spacing:.1em}
      .cf-art{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gold);position:relative;min-height:0}
      .cf-art svg.art{width:58%;height:auto;max-height:92%}
      .cf-pips{position:absolute;inset:2% 4%}
      .cf-pips svg{position:absolute;width:21%;height:auto;transform:translate(-50%,-50%);color:var(--gold)}
      .cf-pips svg.big{width:44%}
      .cf-court{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:30%;color:var(--gold)}
      .cf-name{font-family:"Noto Serif SC",serif;font-weight:700;text-align:center;font-size:14.5cqw;line-height:1.25;white-space:nowrap}
      .cf-en{font-family:"Cinzel",serif;text-align:center;font-size:6.3cqw;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden}

      /* ---------- reading ---------- */
      .rrow{display:flex;gap:16px;padding:16px 0;border-top:1px dashed var(--panel-line)}
      .rrow:first-child{border-top:none;padding-top:2px}
      .rrow .mini{flex:0 0 auto;--cw:66px}
      .rrow .r-body{flex:1;min-width:0}
      .rrow .r-pos{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.16em}
      .rrow .r-title{font-family:"Noto Serif SC",serif;font-size:18.5px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
      .tag{font-family:"Noto Sans SC",sans-serif;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;line-height:1.7}
      .tag.up{background:var(--gold);color:#fff}
      @media (prefers-color-scheme: dark){ .tag.up{color:#221a05} }
      .tag.rev{background:var(--accent);color:#fff}
      .rrow .r-kw{font-size:12.5px;color:var(--muted);margin:1px 0 5px}
      .rrow p{margin:0 0 5px}
      .rrow .r-theme{font-size:13.5px;color:var(--muted)}
      .rrow .r-theme b{color:var(--gold);font-weight:700}
      .linklike{background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
      .summary{margin-top:18px;background:var(--gold-tint);border:1px solid var(--gold);border-radius:14px;padding:18px 20px}
      .summary h3{font-size:17px;margin-bottom:8px;color:var(--ink)}
      .summary ul{margin:0;padding-left:1.25em}
      .summary li{margin:4px 0}
      .summary .advice{margin-top:10px;font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700}

      /* ---------- library ---------- */
      .lib-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
      .lib-head h2{margin:0}
      .lib-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:14px 0 16px}
      .lib-tools input{
        flex:0 1 230px;border:1px solid var(--panel-line);border-radius:999px;background:var(--chip-bg);
        color:var(--ink);font:inherit;font-size:13.5px;padding:7px 15px;outline:none;
      }
      .lib-tools input:focus{border-color:var(--gold)}
      .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px}
      .lib-item{text-align:center}
      .lib-item .tcard{width:100%}
      .lib-item .li-name{font-size:12px;margin-top:5px;color:var(--muted);line-height:1.3}
      .lib-item:hover .cf-name{color:var(--gold)}

      /* ---------- history ---------- */
      .hrow{padding:12px 0;border-top:1px dashed var(--panel-line)}
      .hrow:first-child{border-top:none;padding-top:0}
      .hrow .h-meta{font-size:12px;color:var(--muted)}
      .hrow .h-q{font-weight:700}
      .hrow .h-cards{font-size:13.5px;color:var(--muted);margin-top:2px}

      footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 20px 0}

      /* ---------- modal ---------- */
      .overlay{position:fixed;inset:0;background:rgba(10,8,20,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
      @media (min-width:640px){ .overlay{align-items:center;padding:24px} }
      .sheet{background:var(--panel);color:var(--ink);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:26px;position:relative;box-shadow:var(--shadow)}
      @media (min-width:640px){ .sheet{border-radius:20px} }
      .sheet .x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-line);background:var(--chip-bg);color:var(--ink);font-size:19px;cursor:pointer;line-height:1}
      .m-in{display:flex;gap:20px}
      .m-in .m-card{flex:0 0 auto;--cw:132px}
      .m-in .m-body{flex:1;min-width:0}
      @media (max-width:560px){ .m-in{flex-direction:column;align-items:center} .m-in .m-card{--cw:118px} }
      .m-body h3{font-size:23px}
      .m-body .m-en{font-family:"Cinzel",serif;letter-spacing:.18em;font-size:12px;color:var(--gold);margin:2px 0 10px}
      .m-body h4{font-family:"Noto Serif SC",serif;font-size:15px;margin:14px 0 4px;color:var(--gold)}
      .m-body p{margin:0;font-size:14.5px}
      .kwchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
      .kwchips span{font-size:12px;border:1px solid var(--panel-line);background:var(--chip-bg);border-radius:999px;padding:1px 10px}
      .m-meta{font-size:12.5px;color:var(--muted);margin-top:12px}

      [hidden]{display:none !important}
      @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
        html{scroll-behavior:auto}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <div class="hero-t">
          <h1>塔罗占卜<span class="en">TAROT READING</span></h1>
          <p class="sub">静下心，默念你想问的事。牌不会替你做决定，但会帮你把心里真正的倾向照出来。</p>
        </div>
        <div class="daily" id="dailyBox">
          <div id="dailyCard"></div>
          <div class="d-info">
            <div class="d-label">今日指引 · 每日一抽</div>
            <div class="d-name" id="dailyName">—</div>
            <p class="d-text" id="dailyText">点一下左边的牌，看看今天的指引。</p>
            <div class="d-lucky" id="dailyLucky"></div>
          </div>
        </div>
      </header>

      <section class="panel" id="askPanel">
        <h2>开始一次占卜</h2>
        <label class="flabel" for="qInput">你想问什么？</label>
        <textarea id="qInput" rows="3" placeholder="例如：这段感情会有结果吗？／最近适合换工作吗？（也可以留空，问问近期的整体运势）"></textarea>

        <span class="flabel">占卜主题</span>
        <div class="chips" id="themeChips"></div>

        <span class="flabel">选择牌阵</span>
        <div class="spreads" id="spreadGrid"></div>
        <p class="spread-note" id="spreadNote"></p>

        <div class="actions">
          <button class="btn primary big" id="btnStart" type="button">洗牌 · 开始占卜</button>
        </div>
      </section>

      <section class="panel" id="stage" hidden>
        <div class="stage-head">
          <h2 id="stageTitle">牌阵</h2>
          <div class="stage-btns">
            <button class="btn ghost" id="btnFlipAll" type="button">一键全翻</button>
            <button class="btn ghost" id="btnAgain" type="button">重新洗牌</button>
          </div>
        </div>
        <p class="stage-q" id="stageQ"></p>
        <div id="shuffleBox">
          <div class="dstack shuffling" id="dstack"></div>
          <p>正在洗牌……在心里默念你的问题</p>
        </div>
        <div id="board" class="board"></div>
        <p class="stage-tip" id="stageTip" hidden>点击牌面逐张翻开，翻完后下方会出现完整解读</p>
      </section>

      <section class="panel" id="reading" hidden>
        <h2>牌面解读</h2>
        <div id="readingList"></div>
        <div class="summary" id="summaryBox"></div>
        <div class="actions">
          <button class="btn primary" id="btnNew" type="button">再占卜一次</button>
        </div>
      </section>

      <section class="panel" id="library">
        <div class="lib-head">
          <h2>塔罗牌库</h2>
          <span class="muted small">韦特塔罗全 78 张 · 点击任意一张查看详解</span>
        </div>
        <div class="lib-tools">
          <div class="chips" id="libChips"></div>
          <input id="libSearch" type="search" placeholder="搜索牌名 / 关键词" aria-label="搜索牌名或关键词" />
        </div>
        <div class="lib-grid" id="libGrid"></div>
        <p class="muted small" id="libEmpty" hidden>没有找到匹配的牌，换个关键词试试。</p>
      </section>

      <section class="panel" id="historyPanel">
        <h2>占卜记录</h2>
        <div id="historyList"><p class="muted">还没有记录。完成一次占卜后，会显示在这里。</p></div>
      </section>

      <footer>塔罗是一种自我观照的工具：牌面照见的是倾向与可能，路最终还是自己走。</footer>
    </div>

    <div class="overlay" id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="牌面详解">
        <button class="x" id="modalX" type="button" aria-label="关闭">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script>

          '<div class="r-body">' +
            '<div class="r-pos">' + p.name + '</div>' +
            '<div class="r-title">' + c.cn + '<span class="tag ' + (d.reversed ? 'rev' : 'up') + '">' + (d.reversed ? '逆位' : '正位') + '</span></div>' +
            '<div class="r-kw">' + kw.join(' · ') + ' ｜ ' + p.hint + '</div>' +
            '<p>' + meaning + '</p>' +
            (theme !== '综合' && c.theme[theme] ? '<p class="r-theme"><b>' + theme + '：</b>' + c.theme[theme] + '</p>' : '') +
            '<button type="button" class="linklike" data-detail="' + cardKey(c) + '">查看「' + c.cn + '」详解</button>' +
          '</div></div>';
      });
      $('readingList').innerHTML = html;
      Array.prototype.forEach.call($('readingList').querySelectorAll('[data-detail]'), function(b){
        b.addEventListener('click', function(){ openModal(cardByKey(b.getAttribute('data-detail'))); });
      });
      $('summaryBox').innerHTML = buildSummary();
      $('reading').hidden = false;
      $('reading').scrollIntoView({behavior:'smooth', block:'start'});
      pushHistory();
    }
    function buildSummary(){
      var drawn = state.drawn, total = drawn.length;
      var majors = drawn.filter(function(d){ return d.card.kind === 'major'; }).length;
      var revs = drawn.filter(function(d){ return d.reversed; }).length;
      var els = {'火':0,'水':0,'风':0,'土':0};
      drawn.forEach(function(d){ els[d.card.el]++; });
      var domEl = '火', domN = -1;
      Object.keys(els).forEach(function(k){ if (els[k] > domN){ domN = els[k]; domEl = k; } });
      var elText = {
        '火':'火元素主导：这件事靠行动与热情推进，想通了就去做，拖延是最大的对手。',
        '水':'水元素主导：情感与关系是这件事的暗线，先处理感受，再处理事情。',
        '风':'风元素主导：关键在信息与沟通——把话说清楚、把事实核对准，局势就会变。',
        '土':'土元素主导：这件事拼的是现实基本盘：钱、时间、身体与耐心，一步一步来。'
      };
      var items = [];
      if (total >= 3){
        if (majors === 0) items.push('这次抽到的全是小阿卡纳：你问的不是命运大事，而是落在日常层面的具体问题——具体、可操作，行动比玄学更重要。');
        else if (majors / total >= 0.5) items.push('大阿卡纳占了多数（' + majors + '/' + total + '）：这件事牵动的不是一时得失，而是更长线的人生课题，值得认真对待。');
        else items.push('大阿卡纳 ' + majors + ' 张：日常事务里藏着一个关键转折点，留意那张大牌所在的位置，它就是题眼。');
      }
      items.push(elText[domEl]);
      if (revs === 0) items.push('全部正位：能量顺畅，没有明显的内耗与堵塞，按解读推进即可。');
      else if (revs > total / 2) items.push('逆位偏多（' + revs + '/' + total + '）：不是事情本身有多糟，而是内在状态先卡住了——先调整自己，再处理外部。');
      else items.push('逆位 ' + revs + ' 张：整体顺中有阻，卡点集中在逆位牌所在的位置，先解那几处。');
      var spread = state.spread;
      var adviceIdx = -1;
      spread.positions.forEach(function(p, i){ if (p.name === '建议' || p.name === '最终结果' || p.name === '核心指引') adviceIdx = i; });
      if (adviceIdx < 0) adviceIdx = total - 1;
      var ad = drawn[adviceIdx];
      var adviceKw = (ad.reversed ? ad.card.rkw : ad.card.kw).join('、');
      var html = '<h3>综合解读</h3><ul>' + items.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul>' +
        '<p class="advice">牌的落点：「' + spread.positions[adviceIdx].name + '」的' + ad.card.cn + '（' + (ad.reversed ? '逆位' : '正位') + '）——关键词是' + adviceKw + '。把这件事做对，比把它做快重要。</p>';
      return html;
    }
    function pushHistory(){
      var now = new Date();
      var hh = ('0' + now.getHours()).slice(-2), mm = ('0' + now.getMinutes()).slice(-2);
      readingLog.unshift({
        time: (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + hh + ':' + mm,
        q: state.question, theme: state.theme, spread: state.spread.name,
        cards: state.drawn.map(function(d, i){
          return state.spread.positions[i].name + '·' + d.card.cn + (d.reversed ? '（逆）' : '');
        }).join('，')
      });
      $('historyList').innerHTML = readingLog.map(function(h){
        return '<div class="hrow"><div class="h-meta">' + h.time + ' · ' + esc(h.spread) + ' · 主题：' + h.theme + '</div>' +
          (h.q ? '<div class="h-q">「' + esc(h.q) + '」</div>' : '<div class="h-q">整体运势</div>') +
          '<div class="h-cards">' + esc(h.cards) + '</div></div>';
      }).join('');
    }

    /* ================= 牌库 ================= */
    var libFilter = 'all', libQuery = '';
    function renderLibChips(){
      var opts = [['all','全部'],['major','大阿卡纳'],['wands','权杖'],['cups','圣杯'],['swords','宝剑'],['pentacles','星币']];
      $('libChips').innerHTML = opts.map(function(o){
        return '<button type="button" class="chip' + (libFilter === o[0] ? ' on' : '') + '" data-f="' + o[0] + '">' + o[1] + '</button>';
      }).join('');
      Array.prototype.forEach.call($('libChips').children, function(b){
        b.addEventListener('click', function(){ libFilter = b.getAttribute('data-f'); renderLibChips(); renderLib(); });
      });
    }
    function renderLib(){
      var list = DECK.filter(function(c){
        if (libFilter === 'major' && c.kind !== 'major') return false;
        if (['wands','cups','swords','pentacles'].indexOf(libFilter) >= 0 && c.suit !== libFilter) return false;
        if (libQuery){
          var hay = c.cn + c.en + c.kw.join('') + c.rkw.join('');
          if (hay.toLowerCase().indexOf(libQuery.toLowerCase()) < 0) return false;
        }
        return true;
      });
      $('libGrid').innerHTML = list.map(function(c){
        return '<div class="lib-item">' + tcardHTML(c, {static:true}) + '<div class="li-name">' + c.cn + '</div></div>';
      }).join('');
      $('libEmpty').hidden = list.length > 0;
      Array.prototype.forEach.call($('libGrid').querySelectorAll('.tcard'), function(b){
        b.addEventListener('click', function(){ openModal(cardByKey(b.getAttribute('data-key'))); });
      });
    }

    /* ================= 详解弹窗 ================= */
    function openModal(c){
      if (!c) return;
      var themeRows = '';
      if (c.kind === 'major'){
        themeRows = ['爱情','事业','财运','学业','健康'].map(function(t){
          return '<h4>' + t + '</h4><p>' + c.theme[t] + '</p>';
        }).join('');
      } else {
        themeRows = '<h4>各主题提示</h4><p>' + ['爱情','事业','财运','学业','健康'].map(function(t){
          return '<b>' + t + '：</b>' + c.theme[t];
        }).join('<br>') + '</p>';
      }
      $('modalBody').innerHTML = '<div class="m-in">' +
        '<div class="m-card">' + tcardHTML(c, {static:true}) + '</div>' +
        '<div class="m-body">' +
          '<h3>' + c.cn + '</h3><div class="m-en">' + c.en + '</div>' +
          (c.desc ? '<p>' + c.desc + '</p>' : '') +
          '<h4>正位 · 关键词</h4><div class="kwchips">' + c.kw.map(function(k){ return '<span>' + k + '</span>'; }).join('') + '</div>' +
          '<p>' + c.up + '</p>' +
          '<h4>逆位 · 关键词</h4><div class="kwchips">' + c.rkw.map(function(k){ return '<span>' + k + '</span>'; }).join('') + '</div>' +
          '<p>' + c.rev + '</p>' +
          themeRows +
          '<div class="m-meta">' + (c.kind === 'major' ? '大阿卡纳 · ' + c.astro + ' · ' + c.el + '元素' : '小阿卡纳 · ' + c.astro) + '</div>' +
        '</div></div>';
      $('modal').hidden = false;
      document.body.style.overflow = 'hidden';
      Array.prototype.forEach.call($('modalBody').querySelectorAll('.tcard'), function(b){
        b.addEventListener('click', function(){});
        b.style.cursor = 'default';
      });
    }
    function closeModal(){ $('modal').hidden = true; document.body.style.overflow = ''; }
    $('modalX').addEventListener('click', closeModal);
    $('modal').addEventListener('click', function(e){ if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

    /* ================= 每日一抽 ================= */
    function dailyCard(){
      var now = new Date();
      var seedStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
      var h = 0;
      for (var i = 0; i < seedStr.length; i++){ h = (h * 31 + seedStr.charCodeAt(i)) >>> 0; }
      var c = DECK[h % 78];
      var reversed = ((h >> 5) % 100) < 38;
      var box = $('dailyCard');
      box.innerHTML = tcardHTML(c, {});
      var btn = box.querySelector('.tcard');
      btn.addEventListener('click', function(){
        if (!btn.classList.contains('flipped')){
          btn.classList.add('flipped');
          if (reversed) btn.querySelector('.face.front').classList.add('is-rev');
          var first = (reversed ? c.rev : c.up).split('。')[0] + '。';
          $('dailyName').textContent = c.cn + ' · ' + (reversed ? '逆位' : '正位');
          $('dailyText').textContent = first;
          var luckyColor = {'火':'红 / 橙色','水':'蓝 / 青色','风':'米白 / 浅黄色','土':'棕 / 墨绿色'}[c.el];
          var luckyNum = c.kind === 'major' ? (c.idx % 9) + 1 : c.rank;
          $('dailyLucky').innerHTML = '幸运色 <b>' + luckyColor + '</b> · 幸运数字 <b>' + luckyNum + '</b>';
        } else {
          openModal(c);
        }
      });
    }

    /* ================= 初始化 ================= */
    $('btnStart').addEventListener('click', startReading);
    $('btnAgain').addEventListener('click', startReading);
    $('btnFlipAll').addEventListener('click', flipAll);
    $('btnNew').addEventListener('click', function(){
      $('reading').hidden = true; $('stage').hidden = true;
      $('askPanel').scrollIntoView({behavior:'smooth', block:'start'});
    });
    $('libSearch').addEventListener('input', function(){ libQuery = this.value.trim(); renderLib(); });
    renderThemes();
    renderSpreads();
    renderLibChips();
    renderLib();
    dailyCard();
    </script>
  </body>
</html>
